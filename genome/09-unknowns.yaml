# Ciclo 23 — aberta pelo incidente de 2026-10-02 (PRF-0099, PRF-0100).
- id: UNK-0017
  kind: unknown
  question: "Que guarda encontra um segredo colado como VALOR em prosa, dentro de repositorio privado, sem afogar o resultado em falso positivo?"
  why_unknown: "As duas varreduras que existem foram lidas na linha em 2026-10-02 e nenhuma alcanca o caso. O inventario de segredos (infra/security/inventario_segredos.py linha 40) casa NOME em maiusculas, e a linha 108 so extrai valor quando ha nome assim a esquerda de igual ou dois pontos: um valor dentro de curl -H ou numa celula de tabela markdown e inalcancavel por construcao. A varredura de privacidade cobre so repositorio PUBLICO, e a propria CLM-0017 diz isso na sua letra; o monolito e private. O que falta nao e configurar melhor nenhuma das duas — e um eixo de deteccao que nenhuma tem: a FORMA do valor. E ai esta a parte que ninguem decidiu, e por isso isto e incognita e nao tarefa: o valor deste incidente tem 11 caracteres com maiuscula, minuscula, digito e simbolo, nao e hex nem base64. Entropia alta o bastante para ser senha e baixa o bastante para colidir com prosa, identificador e hash curto. Casar por forma pega senha escolhida por pessoa, que foi exatamente o caso; casar por forma tambem acusa texto comum, e varredura que acusa demais e desligada em duas semanas — e varredura desligada e pior que varredura ausente, porque parece cobertura."
  required_evidence: "Uma guarda com controle positivo cuja amostra contenha VALOR COLADO em prosa, e nao so nome de variavel, nas duas formas deste incidente: celula de tabela markdown e cabecalho dentro de curl -H. Com escopo que inclua repositorio PRIVADO, amostra montada por CONCATENACAO (como a FIT-015 ja exige, para a amostra nao acusar o arquivo da propria guarda) e, acima de tudo, a taxa de falso positivo MEDIDA sobre a arvore real dos 19 repositorios antes de a guarda virar bloqueante — numero medido, nao suposto, porque e esse numero que decide se o eixo da forma e utilizavel ou se a resposta certa e outra (por exemplo exigir que todo segredo chegue por nome conhecido, e recusar prosa que contenha qualquer coisa com cara de valor perto de um nome de segredo). Enquanto o numero nao existir, a guarda nao existe."
  owner: titular
  blocks: [CLM-0075]

# Ciclo 25 — a classe que seis casos medidos revelaram.
- id: UNK-0018
  kind: unknown
  question: "Quantas declaracoes de ESTADO existem dentro da lei do LICEU, e o que deve acontecer com elas — passar a ser DERIVADAS na CI, ou sair da lei por nao serem norma?"
  why_unknown: "Seis foram encontradas em dois dias SEM NINGUEM PROCURAR, e esta medida cada uma (PRF-0126): o 114 de arquivos proibidos no CORE onde ha 96; o required 8 do dossie cujo teto e 7; o resumo do Event Registry que dizia 8/10/12 onde havia 9/11/17; o trio adrs_pendentes mais estado ABERTA mais ADR_REQUIRED, com a ADR-001 decidida ha 21 dias; o 'DEFINIDO — 0/7 implementados' do Contract Registry, que tem 15 contract_ids; e o IMPLEMENTED_IN_MONOLITH 0, que nao e falso nem verdadeiro porque ninguem escreveu o que conta como implementado. Quatro falsas, uma incoerente, uma sem definicao. O QUE AS TORNA UMA CLASSE: nenhuma regra as le. Nem as dezesseis do liceu_registry_check, que conferem resolucao de nome, SemVer, schema e lineage mas nunca contagem; nem o juiz do genoma, que deriva tudo das provas por desenho e nao abre a lei para conferi-la contra si mesma. Elas vivem no ponto cego de dois instrumentos ao mesmo tempo, e e por isso que envelhecem sem avisar. E A PERGUNTA NAO E 'como consertar os seis': e QUANTOS SAO e O QUE A LEI DEVE CONTER. A primeira metade e medicao e cabe a mim; a segunda e normativa — decidir que um campo sai da Constituicao, ou que passa a ser calculado pela CI, e decidir o que a lei E. Nenhum dos seis quebrou nada, e e isso que torna a classe perigosa em vez de urgente: o custo nao e falha, e um leitor que confia na lei sem recontar."
  required_evidence: "DUAS COISAS, e so a primeira e minha. PRIMEIRA, a varredura exaustiva: uma leitura de todos os artefatos governados — Constituicao, Contract Registry, Event Registry, Producer Registry e o ledger de reconciliacao — classificando cada campo que afirme contagem ou situacao em NORMA (fica, porque diz o que deve ser) ou ESTADO (nao fica como esta, porque diz o que e). O resultado tem de ser o NUMERO de ocorrencias por artefato, nao uma amostra, e cada ocorrencia com o valor declarado ao lado do valor medido — porque, como a PRF-0126 registra, a enumeracao de hoje e oportunista e nao autoriza dizer que sao seis. SEGUNDA, a decisao do titular sobre cada ESTADO encontrado, entre tres saidas, e a escolha pode ser diferente por campo: DERIVAR, com o valor calculado pela CI a partir do proprio artefato e a lei deixando de carregar o numero; RETIRAR, por ser estado e nao norma, e viver no genoma ou no relatorio em vez da lei; ou MANTER com procedencia e data obrigatorias, aceitando que envelhece mas exigindo que diga quando foi medido — como o campo violacao do no core ja faz com '[DECIDIDO 2026-08-29]', que foi o unico dos seis cuja defasagem era detectavel pela propria escrita. O QUE NAO ENTRA ENQUANTO ISSO: guarda nova. Construir uma regra que confira contagem antes de decidir QUAIS campos devem existir seria congelar os seis defeitos em forma de teste, e a regra do titular contra instrumento novo sem erro concreto se aplica ao contrario aqui — o erro concreto existe seis vezes, e justamente por isso a guarda errada custaria caro."
  owner: titular
  blocks: [CLM-0096]
