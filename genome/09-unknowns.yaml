- id: UNK-0008
  kind: unknown
  question: "Quais sao os indices urbanisticos vigentes da zona ZM em fonte que uma maquina consiga reconferir, ou certificada pela Prefeitura?"
  why_unknown: "A LC 030/2007 oficial e digitalizacao sem camada de texto (0 objetos /Font em 261 paginas). A Tabela I vigente e a da LC 99/2021, que tem camada de OCR — mas na pagina da tabela o OCR desfaz linhas e colunas ('50so50s07060'), e amarrar um numero a linha ZM ali seria chute. Os valores em uso (C.A 2,0; T.O 60%; T.P 10%; area minima 360 m2; frente 5,00 m; recuos) vieram de LEITURA VISUAL da imagem oficial a 400 dpi. Nao existe texto consolidado oficial, e a lista de 13 alteracoes e a que a propria Camara publica. Alem disso a Tabela I tem uma coluna 'I.E' com valor 4,0 para ZM cujo significado nao aparece no texto da lei."
  required_evidence: "O TEXTO CONSOLIDADO oficial da lei de uso e ocupacao, legivel por maquina — e so ele. A certidao de diretrizes saiu desta linha em 2026-09-27: a PRF-0045 mostra que ela nao esta no caminho da P-001, e pedir como evidencia um documento que nao sera tirado e manter a incognita aberta com uma porta falsa. A coluna I.E se estreitou e nao fecha por aqui: a PRF-0047 derivou o significado (Indice de elevacao) e a formula (area total / area do terreo) da prancha-modelo oficial do municipio, e a P-001 declara I.E. = 1; o que falta e saber se o 4,0 da linha ZM e maximo, minimo ou exigencia, e isso so o texto consolidado diz. Comparar 1,00 com 4,0 sem a direcao do limite seria inventar a regra a partir do numero. Esta e a conferencia que o LICEU precisa fechar ANTES do protocolo: sem ela as quatro previsoes pre-registradas perdem sentido, porque o LICEU passaria a comentar um resultado ja conhecido."
  owner: titular
  blocks: [CLM-0019]

- id: UNK-0009
  kind: unknown
  question: "Area minima do lote (360 m2) e frente minima (5,00 m) da Tabela I se aplicam a uma unidade dentro de condominio ja aprovado?"
  why_unknown: "O terreno da P-001 tem 175 m2 e a area minima do lote na ZM e 360 m2. Aplicar o limite calado daria NAO ATENDE — e a tabela nao resolve a aplicabilidade: sao restricoes de parcelamento, e a unidade esta em regime de condominio. O motor recusa decidir isso sozinho e nomeia a falta. METADE RESPONDIDA em 2026-09-27: o REGIME nao e mais duvida. A prancha urbanistica aprovada declara condominio residencial de uso misto, com unidades autonomas em lotes condominiais, e traz certidao do proprio departamento que aprova projetos e certificado do GRAPROHAB (PRF-0048). O que sobra e so a APLICABILIDADE. E ha evidencia forte, que nao e prova: o mesmo departamento aprovou 523 unidades cuja area media fica em torno de 199 m2, todas abaixo do minimo de 360 m2 da Tabela I. Se o minimo alcancasse a unidade em condominio, essa aprovacao nao poderia ter existido. Isso aponta com forca para um lado e NAO fecha: pode haver regra propria, excecao ou fundamento que o documento nao mostra, e concluir a partir do comportamento do orgao e inferir a regra pelo resultado — exatamente o que a PRF-0047 recusou fazer com o 4,0 da coluna I.E."
  required_evidence: "Duas coisas, e nenhuma delas e certidao — a Certidao de Diretrizes saiu desta linha em 2026-09-27 pela PRF-0045, que a mostra fora do caminho da P-001. Primeira: a matricula atualizada (item 20 do protocolo), que diz o REGIME — se loteamento ou condominio —, hoje em aberto e contraditorio na propria planta, que declara unidade autonoma em condominio e ao mesmo tempo loteamento sem associacao obrigatoria (a FC-006). Segunda: a APLICABILIDADE do limite de lote a unidade em condominio, que nao tem oraculo anterior ao protocolo — e o parecer, a exigencia ou o alvara da Prefeitura sobre o projeto que a resolve, exatamente o ato que resolve as quatro previsoes pre-registradas. A LC 097/2020, que regulamenta condominio de lotes no municipio, foi lida e NAO fecha esta incognita — da argumento para os dois lados (PRF-0028)."
  owner: titular
  blocks: [CLM-0019]

# UNK-0006 ENCERRADA em 2026-09-22, pela U5. A pergunta era o que fazer quando o
# estudo tem UM candidato real e o contrato exige alternatives >= 2. A resposta
# nao era recusar o estudo nem afrouxar o contrato: com um candidato, as duas
# alternativas reais nao sao dois lugares, sao duas decisoes sobre o mesmo lugar
# — ADOTAR e NAO ADOTAR. O metodo john.go-no-go/0.1 faz isso, e nada foi
# fabricado: GO e NO_GO sao duas alternativas de verdade.

# A1 (ciclo 11) — a Lei 13.460/2017 obriga a Carta de Servicos a declarar prazos,
# e a de Vargem Grande Paulista nao declara o desta certidao. Sem o prazo, nao da
# para saber se o oraculo chega antes do protocolo — e e disso que depende a
# janela de pre-registro ficar aberta.
- id: UNK-0010
  kind: unknown
  question: "Dos onze itens que o DHAP exige para protocolar a Casa P-001, quais estao em maos? Seis nao aparecem no acervo varrido, e ausencia ali nao e ausencia no mundo."
  why_unknown: "A pergunta que estava aqui era outra, e estava errada: 'qual o prazo de emissao da Certidao de Diretrizes'. Nao existe Certidao de Diretrizes no caminho da P-001 — a PRF-0045 mostra por tres fontes que o ato e o protocolo do projeto simplificado (Decreto 054/2017) e que a Certidao e servico irmao, que nenhuma linha de Construcao Residencial exige. O relogio do processo nao e prazo de orgao: e a montagem do conjunto, porque o rodape da RELACAO diz que o pedido so e protocolado se os documentos exigidos estiverem anexos. Medido o acervo em 2026-09-27, cinco itens tem estado derivado de documento e seis nao tem evidencia nenhuma: 1 (requerimento), 2 (identidade do requerente), 6 (carne de IPTU), 8 (declaracao de numero oficial), 13 (memorial de calculo de esgoto) e 20 (matricula atualizada). Nao se afirma que essas seis pecas nao existem: o acervo varrido e uma pasta, nao o mundo, e confundir as duas coisas seria a CLM-0048, que fica aqui bloqueada de proposito. Tres delas ficam com o titular por carregarem dado pessoal, e pedir e ato do RT."
  required_evidence: "Para cada um dos seis: a peca, ou a confirmacao de que ja esta em maos do titular. A ordem de obtencao esta derivada pela validade no proprio modulo — primeiro o que demora e nao vence (8 e 13, junto com a renovacao do registro profissional, a caderneta e a declaracao de agua), por ultimo o que vence (6 e 20), porque puxar a matricula cedo demais obriga a puxar de novo e puxar de novo custa dinheiro."
