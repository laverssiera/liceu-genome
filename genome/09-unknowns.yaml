# UNK-0006 ENCERRADA em 2026-09-22, pela U5. A pergunta era o que fazer quando o
# estudo tem UM candidato real e o contrato exige alternatives >= 2. A resposta
# nao era recusar o estudo nem afrouxar o contrato: com um candidato, as duas
# alternativas reais nao sao dois lugares, sao duas decisoes sobre o mesmo lugar
# — ADOTAR e NAO ADOTAR. O metodo john.go-no-go/0.1 faz isso, e nada foi
# fabricado: GO e NO_GO sao duas alternativas de verdade.

# A1 (ciclo 11) — a Lei 13.460/2017 obriga a Carta de Servicos a declarar prazos,
# e a de Vargem Grande Paulista nao declara o desta certidao. Sem o prazo, nao da
# para saber se o oraculo chega antes do protocolo — e e disso que depende a
# janela de pre-registro ficar aberta.
- id: UNK-0010
  kind: unknown
  question: "Qual o prazo de emissao da Certidao de Diretrizes no DHAP de Vargem Grande Paulista?"
  why_unknown: "Nao consta em fonte oficial on-line. A RELACAO DE DOCUMENTOS do DHAP nao traz prazo, e a Carta de Servicos ao Usuario tambem nao — embora a Lei Federal 13.460/2017, que a institui, exija a divulgacao de prazos. Inventar um prazo plausivel seria fabricar numero, e o modulo devolve None de proposito, com teste que impede o contrario."
  required_evidence: "Resposta do DHAP no balcao, por telefone ou por e-mail (canal declarado na Carta de Servicos), registrada com a data em que foi obtida."
  owner: titular
  blocks: [CLM-0032]

