- id: UNK-0001
  kind: unknown
  question: Como replicar o estado de autoridade para que a Testemunha observe a Ativa por um caminho independente?
  why_unknown: As tres Maes sao linhas de uma tabela so; a replicacao da Sucessora nao existe em codigo.
  required_evidence: "DECISAO PARCIAL TOMADA (titular, 2026-09-22): a SONDA vem primeiro — a Testemunha observa a Ativa pela rede, nunca pelo armazenamento, e attest() deixa de aceitar veredito no corpo. A topologia (A, B ou C) NAO espera mais leitura: o §6 foi lido na integra em 2026-09-23, do arquivo docs/ADR-003-replicacao-do-estado-de-autoridade.md no liceu-protocol 9cb4fe7 (sha256 5386d26633c2a71b54129d65831319908420686a0b746f2f6766b852acfab21f). Falta a DECISAO; inclinacao do titular: C, com duas condicoes — na C a Testemunha NAO usa replay para julgar se a Ativa esta viva (replay reconstroi estado da Sucessora; sonda observa a Ativa) e o event store e pre-requisito. CORRECAO DE 2026-09-30, com fonte: a segunda condicao estava registrada aqui como 'backup TESTADO do event store', e o ADR nao pede backup, pede REPLICACAO. Backup testado e restaurar depois; replicacao e ter em dois lugares durante. O §3, na opcao C, diz na linha de particao: 'o event store precisa ser ele proprio replicado — e volta-se a A (streaming) ou a B (consenso para o log de fatos). Dois stores que divergem numa particao sao duas historias; o replay da duas epocas'. E na linha de custo: 'nao resolve replicacao: transfere a pergunta para o store. Serve como forma dos eventos (auditabilidade), nao como mecanismo'. QUAL event store, tambem com fonte: o §1.1 do mesmo ADR diz que o estado de autoridade vive em 'um Postgres (db_core_os, volume db_core_os_data, compose do CORE)' e que o control plane le 'EventLog (o event store, mesma base)'. Entao e o db_core_os, e ele e a MESMA base do estado de autoridade — o que e parte do problema, nao uma conveniencia. O CONSTRUTORA tem 'Backup do db_core_os (dump + restore check)' verde na CI, e ele e real: semeia o store, roda infra/backup/backup_core_db.sh e confere o manifesto contra o que o store tinha. Ele NAO satisfaz esta condicao — satisfaz outra coisa. E HA UMA TERCEIRA LINHA no §3 que alcanca a CLM-0006 direto: 'Testemunha: le o mesmo store. Mesma objecao de A, a menos que a atestacao seja gravada num store que NAO seja o da Ativa — e ai ha dois stores a reconciliar'. Pela letra do ADR, a opcao C nao fecha a observacao independente: reabre como dois stores a reconciliar. A ORDEM, corrigida em 2026-09-30 com fonte no §4 do mesmo ADR. Mais cedo hoje eu escrevi aqui 'topologia decidida, sonda implementada, prova sob particao — nessa ordem, porque nenhuma das duas ultimas tem trabalho disponivel antes da decisao'. Isso estava ERRADO e contradizia, dentro deste mesmo campo, a decisao parcial de 2026-09-22 que diz 'a SONDA vem primeiro'. Quem decide e o ADR, e ele e explicito: '§4 — Para a Testemunha ser testemunha, duas coisas tem de existir, INDEPENDENTEMENTE DA OPCAO: (1) uma sonda propria: a Testemunha, como processo no seu dominio, verifica a Ativa por um canal que nao seja o banco — HTTP /authority/state assinado pela instancia (com epoca), ou heartbeat no NATS com o segredo de mother-a. O que ela grava em observed_active_instance_id/verdict passa a ser RESULTADO DE SONDA, nao declaracao. (2) um lugar proprio para gravar: a atestacao nao pode viver so no Postgres da Ativa. Em B, e o log de consenso. Em A ou C, e preciso um store da Testemunha que promote() consulte alem do proprio banco. Sem (1), qualquer opcao replica uma declaracao. Sem (2), qualquer opcao grava a declaracao onde a Ativa manda. A OPCAO ESCOLHIDA PARA A CAMADA A DETERMINA SE (2) VEM DE GRACA (B) OU TEM DE SER CONSTRUIDO (A, C).' Logo: (1) a SONDA nao espera nada — observar a Ativa pela rede nao depende de onde o estado mora, e era trabalho disponivel antes da decisao. FEITO em 2026-09-30: a sonda existe (infra/authority/sonda_testemunha.py, PRF-0065, CLM-0059), mede contra socket de verdade e o plano so aceita o que ela mediu. O que ela NAO faz: nao ha Ativa separada para ela olhar, entao a CLM-0006 segue REFUTED — o codigo existe, a separacao nao. MEDIDO em 2026-10-01 (PRF-0066) e e pior do que 'mesmo processo': no ambiente implantado NAO EXISTE Testemunha nem Sucessora. Um unico servico roda o CORE, o padrao semeia so mother-a ACTIVE, e mother-b/mother-witness aparecem apenas em teste — attest() recusaria com only_witness_attests. A prova sob particao real nao tem alvo. A CLM-0006 nao espera CODIGO, espera INFRAESTRUTURA, e a Constituicao diz o que isso custa: 'se as tres compartilham infraestrutura, a testemunha nao acrescenta independencia — apenas custo'. A decisao deixa de ser 'A, B ou C' e passa a ser: tres processos em dominios de falha distintos — quanto custa, onde rodam, quem opera. (2) o lugar proprio para gravar DEPENDE da opcao. A prova sob particao espera a sonda. O QUE ISSO FAZ COM A CLM-0006 e com a CLM-0007: construir a sonda alcanca a CLM-0006 (observar de forma independente) em qualquer topologia. NAO alcanca (2), e por isso a Testemunha so vira testemunha por inteiro com a opcao decidida — o que mantem a CLM-0007 e esta incognita atras da decisao, mas NAO a CLM-0006. E A PERGUNTA DA DECISAO tambem muda de forma, pelo que o §3 diz da opcao C: ela nao resolve replicacao, transfere para o store. CORRECAO DE ROTULO, 2026-09-30: as tres citacoes acima estavam atribuidas ao §6 e sao do §3. As opcoes A, B e C vivem no §3 ('As opcoes — sem escolher'); o §6 e 'Custo operacional para quem opera sozinho', e ele mesmo abre dizendo 'O §3 da o custo de cada opcao em termos de sistema'. A outra referencia ao §6 neste genoma, a que cita 'nenhuma das tres dispensa o item (1) do §4', esta CERTA — essa frase e do §6. O conteudo citado sempre foi o certo; o numero da secao, nao. O QUE O §2 EXIGE, e que nao estava registrado em lugar nenhum. Ele separa o que precisa ser replicado em camadas, e a camada A — estado de arbitragem — contem 'authority_state (epoca, ativa, emissora), authority_instances (papeis), AUTHORITY_ATTESTATIONS VIGENTES (nao expiradas, nao consumidas)', com exigencia 'LINEARIZAVEL: uma unica sequencia de epocas visivel igual em todos os dominios; e o que o fencing compara'. As camadas B (historico) e C (event store) precisam so de durabilidade, e o §2 diz que o backup 'ja as cobre contra perda, NAO contra particao'. ISSO ESTREITA A PERGUNTA DA DECISAO. Observar nao exige store: a Testemunha nao le epoca nem papeis para formar veredito, e a sonda (PRF-0065) prova que da para medir sem ler nada — o §4(1) ja dizia isso. Mas ATESTAR exige: a atestacao VIGENTE e camada A, logo precisa estar na sequencia linearizavel que o fencing compara, e nao basta um log local no dominio da Testemunha. Nao a transforma em replica do estado — ela nao precisa LER nada —, e tambem nao e 'so um lugar para gravar': e um caminho de escrita que participa da linearizabilidade. A reconciliacao cai sobre o promote(), que pelo §4(2) 'le de dois lugares e exige que batam', nao sobre a observacao. O §6 AINDA ACRESCENTA DUAS COISAS. Sobre a opcao A: 'e a unica que NAO responde ao §4 — a Testemunha continua lendo a Ativa'. E o fechamento, que previu exatamente o estado de hoje: 'Nenhuma das tres dispensa o item (1) do §4 — a sonda propria da Testemunha. Ela e trabalho seu em qualquer topologia, e SEM ELA A CLM-0006 CONTINUA REFUTED MESMO COM A REPLICACAO PRONTA. Seria falso dizer o contrario.' E O §7 JA TINHA POSTO A PERGUNTA, na sua pergunta 2: 'A Testemunha vota? Em B, e no de consenso. A Constituicao diz so informa. Ou se separa em contrato VOTAR NO LOG de AUTORIZAR ATOS, ou a Testemunha fica fora do quorum (2 nos de consenso + 1 observador — e 2 nos nao tem maioria numa particao: volta-se a duas Maes sem quorum).' E na pergunta 3 oferece a saida para a camada C: 'O store nao precisa de consenso se a guarda de identidade (ADR-002) aceitar que, numa particao, o lado minoritario NAO ACEITA FATOS (fail-closed). Se aceitar, streaming sincrono + backup basta. Se nao, e consenso para tudo — e o custo muda de escala.'  Entao a pergunta nao e 'A, B ou C' — e O QUE REPLICA O EVENT STORE, e como a Testemunha observa sem depender daquilo que o replica. Um store so e um dominio de falha e o problema volta; um store por Mae exige reconciliacao e a Testemunha vira replica, que e exatamente o que o §4 diz que ela nao pode ser. Sem responder isso, a opcao C e a opcao A com outro nome. SOBRE A SONDA, medido em 2026-09-30 e pior do que se vinha dizendo: nao e que Testemunha e Ativa estejam no mesmo processo — NAO EXISTE SONDA. O authority_control_plane.py nao tem httpx, requests, urlopen nem socket, e active_probe aparece em tres lugares: o modelo do corpo em main.py, o servico, e TESTES. Todo active_probe que ja existiu neste sistema veio de um teste. O Y1.b (PRF-0059) entregou o lado do PLANO no contrato: ele sabe receber medida, derivar veredito e recusar quem nao observou. Quem observa nao existe. NOTA SOBRE O HASH acima: ele confere sobre a forma CRLF do arquivo na arvore de trabalho. Quem conferir a partir do blob do git (LF) obtem 054675c8be078123c42f12ca4f204eadbaad1a63c76c036fc95740dc346f1dee e concluiria que o registro esta errado. O surface_hash do genoma normaliza para LF justamente para nao depender disso; este hash nao foi normalizado. ENTRADA DE DECISAO REGISTRADA EM 2026-10-01 (titular pediu: entrada, NAO decisao). PORTE MEDIDO, e e medicao de processo, nao estimativa (PR 85 do CONSTRUTORA): RSS lido da API do sistema operacional. Interpretador vazio 11,2 MiB; + fastapi 43,2; + sqlalchemy 56,8; + app.main com 321 rotas 92,5 MiB. A sonda da Testemunha: 21,0 MiB importada, 23,8 apos uma sondagem real, e 23,8 APOS 51 SONDAGENS SEGUIDAS - nao acumula por ciclo, que era a pergunta de 'rodar em intervalo', e nao toca disco. Com o shared_buffers default do postgres:15 (128 MB, documentacao oficial da propria versao) o piso somado de UMA ponta completa e ~221 MiB antes de qualquer requisicao. A SUCCESSOR pede O MESMO que a ACTIVE: mesma imagem, mesma aplicacao; muda o trafego, nao o codigo carregado. RESSALVAS NO PROPRIO NUMERO: CPython 3.12 em Windows fora de conteiner; app.main so carrega com EVENT_BUS_PROVIDER=memory porque com redis ele RECUSA subir (fail-closed, CLM-0003); e um router ficou de fora por dependencia ausente, entao 92,5 MiB e piso do piso. FAIXA DE PRECO, com a procedencia de CADA numero, porque ela difere. LIDO POR MIM em 2026-10-01, da pagina do proprio provedor, com plano e preco ASSOCIADOS: OVHcloud '2027 VPS-1', 2 vCores + 4 GB RAM + 40 GB SSD NVMe, 'From EUR 3,81 ex. VAT/month' (ovhcloud.com/en-ie/vps); netcup 'VPS 500 G12.5', 2 vCore + 4 GB RAM + 64 GB SSD, EUR 8,26/mes em contrato de 12 meses, EUR 9,50 com IVA de 19% (netcup.com/en/server/vps). LIDO POR MIM em 2026-09-30: Oracle Always Free (VM.Standard.E2.1.Micro, duas por tenancy, pela documentacao oficial) e a tabela da DigitalOcean. NAO LIDO, e nao estimado: Hetzner - QUARTA tentativa falhou hoje, a pagina nao entrega preco no DOM -, netcup 'VPS pico' e RackNerd. UMA DIVERGENCIA QUE O TITULAR PRECISA SABER: a fonte que ele trouxe da o netcup VPS 500 por EUR 3,35-4,47, e a pagina do netcup diz EUR 8,26 sem IVA. Quando a fonte de terceiro e a pagina do provedor discordam, vale a do provedor. CONSEQUENCIA ARITMETICA: o piso de ~EUR 7-8/mes para DUAS pontas completas se sustenta na OVH (2 x 3,81 = EUR 7,62 sem IVA), e NAO no netcup (2 x 8,26 = EUR 16,52). A faixa esta certa; o provedor que a sustenta e outro. E 4 GB de RAM contra um piso de 221 MiB e folga de 18x - o porte deixou de ser a variavel. O ACHADO 'CONTA E DOMINIO DE FALHA' FICA REGISTRADO COMO LEITURA, E NAO COMO OBSERVACAO, porque a evidencia oferecida para ele NAO CONFERE. Foi afirmado que 'uma condicao de faturamento no GitHub derrubou a CI dos dezenove repositorios ao mesmo tempo' nesta sessao. MEDIDO em 2026-10-01 sobre o historico de corridas dos 19 repositorios (ate 60 corridas por repositorio, 19 de 19 respondidos): o MAXIMO de repositorios distintos com falha na MESMA hora, em toda a historia disponivel, e TRES, em 2026-09-14T12. Nunca 19. Os 22 'startup_failure' que existem estao TODOS num unico repositorio (BIM.ARQ.ENG, 2026-09-18), e nao nos dezenove. Nesta sessao (30/09 e 01/10) as falhas sao seis, em dois repositorios: tres no John-Brasileiro- (Platform Validation, o SealedSecret) e tres no CONSTRUTORA, das quais duas foram causadas por mim - a guarda de superficie acusando arquivo que eu mudara. Nenhum evento de faturamento aparece. ISSO NAO REFUTA O ARGUMENTO, e e importante separar: conta compartilhada E infraestrutura compartilhada, e a Constituicao exige da Testemunha 'dominio de falha distinto das duas Maes de autoridade', com a razao escrita 'se as tres compartilham infraestrutura, a testemunha nao acrescenta independencia - apenas custo'. Pela letra, tres contas no mesmo provedor falham junto, e isso basta para a decisao. O que NAO existe e a observacao: registrar 'provado nesta sessao' seria inventar um evento. Fica como LEITURA DA CONSTITUICAO, que e o que ela sempre foi, e com forca suficiente. A ASSIMETRIA DO MODO DE FALHA, essa sim MEDIDA, e esta na PRF-0061: a Testemunha caindo produz ACTIVE_UNOBSERVABLE, a promocao fica BLOQUEADA, a epoca NAO avanca, e sai escalacao com motivo nomeado; e a Testemunha cega que insiste em concordar e recusada no atestar. Logo a falha dela e SEGURA: hospedagem instavel custa escalonamento desnecessario, nunca promocao indevida. ISSO INVERTE A INTUICAO DE CUSTO - a ponta que exige independencia e a que menos precisa de confiabilidade, e por isso cabe em plano gratuito ou em hardware do titular, que e um dominio de falha genuinamente distinto. O PRECO DISSO E DISPONIBILIDADE: com a Testemunha fora do ar a promocao fica bloqueada - seguro, e indisponivel. E a ressalva da Oracle continua valendo para o plano gratuito: 'home region' e 'out of host capacity' sao condicoes documentadas, e uma Testemunha que nao consegue ser RECRIADA quando precisa e uma Testemunha que nao existe. O QUE ESTA ENTRADA NAO DECIDE: nada. A decisao e do titular, e o fechamento do §6 continua valendo - nenhuma das tres topologias dispensa a sonda, e ela ja existe. DECISAO DO TITULAR REGISTRADA EM 2026-10-09, e registrada como DECISAO e nao como implementacao, prova ou escala — a regra final do proprio documento diz que 'decisao, execucao e comprovacao sao estados distintos'. O QUE ELE DECIDIU, nas palavras dele: duas pontas completas de autoridade em um provedor principal e uma Testemunha minima em segundo provedor, com dominio administrativo e faturamento independentes; a falha da Testemunha produz UNOBSERVABLE, sem promocao automatica de autoridade. A decisao AUTORIZA implementacao, testes e coleta de evidencias, e NAO AUTORIZA declarar REGIONAL comprovada; CLM-0006, CLM-0007 e esta incognita seguem pendentes por instrucao expressa dele. ESTA INCOGNITA NAO FOI ENCERRADA, e nao e descuido: ele mandou mante-la. UMA METADE DA DECISAO JA ESTA SATISFEITA E PROVADA: a exigencia de que a falha da Testemunha produza UNOBSERVABLE sem promocao automatica e o comportamento atual, medido na PRF-0061 (prova a CLM-0057) — ACTIVE_UNOBSERVABLE existe, e a nota de la descreve o que ele corrigiu: antes, Testemunha sem rota ate a Ativa escolheria 'morta', e ACTIVE_DOWN com concordancia PROMOVE. Essa metade nao espera trabalho. E UMA DIVERGENCIA DE ROTULO QUE ESPERA A PALAVRA DELE. O titulo da decisao diz 'Opcao B', e a Opcao B do ADR-003 nao esta no eixo que a decisao descreve. Lido no §3: 'B — protocolo de consenso (Raft/etcd) para a camada A. So o estado de arbitragem vive num cluster de consenso com 3 nos em 3 dominios'. A decisao descreve HOSPEDAGEM E FATURAMENTO; a Opcao B descreve MECANISMO DE REPLICACAO. Tres tensoes aparecem ao sobrepor um ao outro, e as tres estao escritas no ADR antes desta decisao existir. PRIMEIRA, o quorum, §7.2: 'A Testemunha vota? Em B, e no de consenso. A Constituicao diz so informa. Ou se separa em contrato votar no log de autorizar atos, ou a Testemunha fica fora do quorum (2 nos de consenso + 1 observador — e 2 nos nao tem maioria numa particao: volta-se a duas Maes sem quorum, que a propria Constituicao reconhece).' Testemunha MINIMA e sem promocao automatica apontam para observador, nao para no votante, e a decisao como escrita cai exatamente no caso que o ADR nomeia como regresso. SEGUNDA, os dois nos votantes no mesmo provedor: B pede 3 nos em TRES dominios, e a decisao da DOIS — as duas pontas num provedor principal, a Testemunha noutro. Caindo o principal, a maioria cai com ele e a Testemunha sozinha nao avanca epoca, o que e seguro e indisponivel. Isso nao contradiz a decisao; contradiz o rotulo. TERCEIRA, o tamanho da ponta, §7.1: 'Tres Maes = tres CORE completos (cada um com kit, boundary, store) ou um control plane extraido do CORE (so a camada A) e um CORE por dominio consumindo-o? A segunda e menor e e a que B pede.' Duas pontas COMPLETAS e a primeira leitura, nao a segunda. E UMA PERGUNTA QUE A DECISAO NAO RESPONDE, §7.5: em B a promocao nao planejada passa a existir (o lease expira e a sucessora propoe), e a Constituicao deixa modo: A DEFINIR. A decisao proibe promocao automatica NA FALHA DA TESTEMUNHA, que e outro evento; o caso do lease da Ativa segue aberto. O QUE EU REGISTREI: a decisao COMO ELA FOI ESCRITA, no eixo da hospedagem, e NAO o rotulo 'Opcao B' com os compromissos do §3 embutidos — registrar o rotulo importaria etcd/Raft, tres dominios votantes e um cliente de consenso no caminho critico de publish, nada disso esta na decisao, e a parte do quorum a contradiz. Qual leitura governa e palavra do titular, e esta incognita guarda as duas ate ela chegar. ROTULO RESOLVIDO PELO TITULAR EM 2026-10-09: Opcao B do ADR-003, com TRES DOMINIOS VOTANTES. Isso encerra a divergencia registrada mais cedo hoje e move a decisao do eixo da hospedagem para o eixo do ADR. O QUE A ESCOLHA IMPORTA, pelo §3: so o estado de arbitragem — epoca, ativa, papeis, atestacoes vigentes — vive num cluster de consenso (Raft/etcd) com tres nos em tres dominios; o event store e o historico seguem em Postgres. A Testemunha E no do consenso, observa a Ativa PELO PROTOCOLO (heartbeat/lease) e grava a atestacao no log replicado, que nao e o banco da Ativa. Pelo §5, a epoca deixa de ser coluna e vira TERM do cluster: o enforce() passa a ler do cluster e o promote() vira 'propor no log'; a minoria nao incrementa, e a Ativa isolada perde a prova de ativacao. O QUE A ESCOLHA SUPERSEDE da propria decisao anterior: a frase 'duas pontas completas em um provedor principal e uma Testemunha minima em segundo provedor' nao sobrevive a 'tres dominios votantes'. Tres nos votantes exigem tres dominios distintos, logo as duas pontas NAO compartilham provedor; e a Testemunha deixa de ser minima — ela passa a ser votante de Raft, com certificados e snapshots. ISSO MUDA A ENTRADA DE PRECO que esta registrada acima: o piso de ~EUR 7-8/mes foi levantado para DUAS pontas completas, e agora sao tres dominios. E a ressalva da Oracle pesa mais do que pesava: 'out of host capacity' num plano gratuito deixa de custar uma Testemunha ausente e passa a custar um MEMBRO DE QUORUM que nao volta — com dois nos restantes o cluster segue (dois de tres e maioria), mas perder qualquer um dos dois para o ecossistema inteiro de publicar. O §6 ja dizia isso de B, e para operador unico: 'B e a unica que nao exige presenca humana no failover, e e a que mais exige presenca no resto: tres nos, certificados, snapshots. Para um operador unico, o risco muda de forma — deixa de ser eu decido errado e passa a ser o quorum cai e o ecossistema inteiro para de publicar. Esse segundo risco e mitigavel (cache com lease no enforce), e a mitigacao tem de estar no plano, nao no improviso.' O QUE A ESCOLHA ABRE, e nenhum destes e meu para decidir. PRIMEIRO, uma OBRIGACAO de contrato: com a Testemunha votando, o §3 exige que se diga em contrato que 'votar no log' nao e 'autorizar atos', porque hoje attest() proibe a Testemunha de qualquer ato alem de atestar. Sem essa separacao escrita, ou ela vota e viola 'nunca autoriza', ou nao vota e volta o caso do §7.2 — dois nos de consenso mais um observador nao tem maioria numa particao. SEGUNDO, e e o achado desta rodada: a porta da ATESTACAO tem de ser preservada explicitamente. Medido em promote(), linhas 393-398: attestation None recusa com promotion_requires_witness_attestation, e isso e porta separada do fencing. B troca a fonte da epoca, nao a porta; e com tres votantes, ACTIVE e SUCCESSOR sao dois, que e maioria. Se promote() virar 'proposta aceita pela maioria' sem preservar a porta, promove-se SEM a Testemunha — e cai justamente a exigencia que o titular escreveu, de que a falha dela produza UNOBSERVABLE sem promocao automatica. Registrado na CLM-0086 e na PRF-0114. TERCEIRO, §7.1, ainda sem resposta: B pede a forma MENOR — um control plane extraido do CORE (so a camada A) e um CORE por dominio consumindo-o —, e nao tres CORE completos. A decisao anterior dizia 'pontas completas'; qual vale, com B escolhido, segue aberto. QUARTO, §7.3: a camada C (event store) fica em streaming mais backup ou em consenso tambem? O ADR da a saida — o store dispensa consenso se a guarda de identidade da ADR-002 aceitar que a minoria NAO ACEITA FATOS. QUINTO, §7.4: o activation_certificate_id, que a Constituicao exige e o codigo nao tem, e natural em B (e o lease) — entra antes ou junto do F3? SEXTO, §7.5: em B a promocao nao planejada passa a existir (o lease expira e a sucessora propoe), e a Constituicao deixa modo: A DEFINIR; a decisao do titular proibe promocao automatica NA FALHA DA TESTEMUNHA, que e outro evento. ESTA INCOGNITA SEGUE ABERTA por instrucao expressa do titular, e agora por motivo mais estreito: o MECANISMO esta decidido; o que falta sao a separacao dita em contrato, as quatro perguntas do §7 acima, e a implementacao com prova que satisfaca o juiz. Decisao nao e execucao, e execucao nao e comprovacao. §7.1 DECIDIDO PELO TITULAR EM 2026-10-09: control plane EXTRAIDO, so a camada A, com um CORE por dominio consumindo-o — que e a forma menor e a que o ADR diz que B pede. Isso encerra a ambiguidade entre 'tres CORE completos' e a forma extraida, e supersede de vez a frase 'duas pontas completas' da primeira versao da decisao. O CUSTO MEDIDO EM 2026-10-09, e ele nao esta onde parecia (PRF-0115): pelo lado de fora a extracao e estreita — o modulo tem 763 linhas e so app/main.py o chama, com 12 referencias, mais tres arquivos de teste. Por dentro ele e acoplado ao banco do CORE: dez gravacoes diretas (db.add ou db.commit), e tres leituras do event store por SQL. O _audit (linhas 180-194) grava AuditEvent direto, entao os quatro event_types authority. que o CORE emite sao LINHAS DE TABELA e nao fatos contratados. E o _latest_fact (linha 684) faz db.query(EventLog), chamado na 697 e na 710 — e na 710 ele le archimedes.planning.state e cefeida.evidence.published, que sao FATOS DE DOMINIO DA CADEIA. As tabelas da camada A e a tabela events sao do mesmo Base, logo da mesma base: o db_core_os que o §1.1 nomeia e que o proprio ADR chama de parte do problema. CONSEQUENCIA PARA O PLANO: um control plane em processo e dominio proprios perde as duas pontas — nao grava no AuditEvent do CORE e nao consulta o EventLog dele. Cada gravacao e cada leitura tem de virar caminho de rede, fato publicado, ou deixar de existir. E a leitura da linha 710 e a mais dura: ela faz o plano de autoridade depender do HISTORICO DA CADEIA, que pela Opcao B fica em Postgres noutro dominio — ou se mantem um caminho de leitura dentro do store do CORE, e volta a objecao que o ADR faz a opcao C ('transfere a pergunta para o store'), ou essa leitura muda de natureza. ISSO POE A PRF-0110 NO CAMINHO CRITICO: os quatro contratos que faltam para os event_types authority. deixam de ser lacuna de catalogo e passam a ser PRE-REQUISITO da extracao, porque fato que atravessa fronteira precisa de contrato. E UM PORTAO PARA O TITULAR OLHAR: a Constituicao poe P1_07B_extracao_fisica como ADR_REQUIRED, 'nao executar antes da ADR', com razao 'extracao toca migrations, auth, Event Store, Codespaces e lineage'. Aquele portao foi escrito para tirar do CORE os dominios que o core_nunca lista, e esta extracao tira uma funcao que o core_somente ADMITE — entao nao e obvio que se aplique. Mas a razao dele nomeia exatamente o que esta extracao toca: migrations (tres tabelas saem), Event Store (treze acessos diretos) e lineage (a linha 710). Se o portao vale, falta uma ADR antes de qualquer codigo; se nao vale, isso tem de ficar dito. ORDEM QUE A DECISAO DEIXA DISPONIVEL: tres trabalhos ja nao esperam mais nada — a separacao 'votar no log' x 'autorizar atos' em contrato, os quatro contratos dos event_types authority., e a preservacao explicita da porta promotion_requires_witness_attestation (PRF-0114). Os tres sao redacao e desenho, nao infraestrutura, e nenhum depende do §7.3, do §7.4 nem do §7.5. AS TRES PERGUNTAS DO §7 RESPONDIDAS PELO TITULAR EM 2026-10-09, e registradas como decisao: nenhuma delas e implementacao, prova ou escala. §7.3 — CAMADA C: aceitar que a minoria RECUSE fatos; streaming sincrono mais o backup que ja existe basta, e nao ha consenso para o store. A razao que ele deu e a do ecossistema inteiro: recusar e melhor que fingir, porque minoria que continua aceitando cria uma SEGUNDA HISTORIA, e reconciliar historias de autoridade nao e problema tecnico, e problema sem solucao automatica. O §3 ja dizia isso — dois stores que divergem sao duas historias. E o custo de disponibilidade aqui e quase nulo: um operador, escala LOCAL, trafego proximo de zero. UM DETALHE QUE ELE PEDIU PARA REGISTRAR JUNTO, e e o tipo de coisa que parece defeito quando acontece: streaming SINCRONO significa que a escrita BLOQUEIA quando a replica esta fora. Isso e fail-closed e e coerente com a CLM-0003, que esta TESTED — sem transporte, nada e dado como publicado —, mas tem de estar escrito, porque vai parecer indisponibilidade. O QUE A GUARDA DE IDENTIDADE COBRE E O QUE NAO, medido no ADR-002: ele NAO fala de particao, minoria nem fail-closed — zero ocorrencias dos tres termos —, entao esta pergunta nao se respondia lendo ele, ao contrario do que o §7.3 sugere. Mas a decisao dele ajuda: o CORE aplica chave igual mais payload_hash igual como replay 200 idempotente, e chave igual com payload_hash diferente como 409 nomeado. Com a minoria recusando, o produtor que repete contra a maioria apresenta a MESMA identidade e recebe replay — o retry fica seguro de graca. O que a guarda nao alcanca e a DIVERGENCIA: o 409 exige que as duas escritas cheguem ao MESMO store, e com dois stores divergindo ninguem o emite. §7.4 — ACTIVATION_CERTIFICATE_ID: fica JUNTO DO F3, porque na Opcao B o lease e o certificado. A funcao dele ja esta cumprida pela epoca (CLM-0004 TESTED), e duas amarras para a mesma garantia com mecanismos diferentes e pior que uma — regra do proprio ADR-002, que recusou A+B porque duas funcoes calculando identidade divergiriam. COM A CONDICAO QUE ELE POS: adiar e legitimo, deixar silencioso nao. A divergencia esta registrada na CLM-0090 e na PRF-0119 — a lei declara cinco campos em cinco lugares, o CONTROL_PLANE_FIELDS carimba quatro, e git grep por activation_certificate no monolito devolve ZERO. §7.5 — PROMOCAO NAO PLANEJADA: automatica SIM, e a atestacao CONTINUA pre-condicao. A formulacao e dele e fecha a questao em duas linhas: o QUORUM decide QUEM, a ATESTACAO decide SE. O argumento decisivo e o que a PRF-0114 mede: com tres votantes, ACTIVE e SUCCESSOR sao maioria — as duas partes INTERESSADAS na promocao podem promover uma a outra, e a Testemunha e a unica desinteressada. Tirar o veto dela transforma o quorum num quorum de parte interessada. E a inversao que ele nomeou vale guardar: o caso automatico e o que acontece de madrugada sem ninguem olhando, logo e o que MAIS precisa de supervisao, nao o que menos. A CONSTITUICAO JA DIZIA MAIS DO QUE 'A DEFINIR', e isto foi medido nas linhas 862-876: o caso PLANEJADO esta decidido como modo MANUAL, com sequencia ordenada de quatro passos e risco_de_split_brain NENHUM; o NAO PLANEJADO tem gatilho 'queda da ativa', modo A DEFINIR, decisao_requerida true, e o campo risco escrito assim: 'automatica e mais rapida e pode promover B enquanto A ainda vive e nao sabe. A epoca torna isso DETECTAVEL, NAO IMPOSSIVEL'. A OPCAO B ALTERA ESSA FRASE, e e a melhor consequencia da escolha: com consenso a minoria NAO incrementa epoca e a Ativa isolada perde a prova de ativacao (§3 e §5), entao o que a epoca so DETECTAVA, o quorum torna INALCANCAVEL. O custo e real e esta aceito: a Testemunha vira dependencia de disponibilidade, e sem ela nem a promocao automatica ocorre. Num sistema de um operador, ser acordado e melhor que acordar com uma promocao indevida. E UMA PREMISSA DO ARRANJO BARATO CAIU, levantada pelo titular e medida na PRF-0120: votante de consenso grava cada requisicao em disco, entao 'sem banco' nao vale mais, e o gargalo num plano compartilhado nao e RAM — e contencao de fsync, que custa perda de lider. A entrada de preco de 2026-10-01 perde tres premissas: 'duas pontas', 'cabe em plano gratuito' e a assimetria de CUSTO. A assimetria de RISCO segue de pe (PRF-0061). O QUE FALTA, e e medicao e nao decisao: preco de tres VPS que publiquem latencia de escrita SEQUENCIAL (nenhum provedor lido a publica — todos publicam IOPS concorrente, que pode ser 10x o sequencial), o RTT real entre os provedores escolhidos, e se a camada A usara etcd ou um Raft embutido."
  owner: titular
  blocks: ["scale:REGIONAL", CLM-0006, CLM-0007]
