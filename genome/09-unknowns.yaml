  why_unknown: "O item 7 aceita duas vias: 'Declaracao de abastecimento de agua ou copia de conta de agua (SABESP) de qualquer imovel da mesma rua'. A conta esta descartada — a unica do acervo e de energia, de outro municipio. Sobra a declaracao, e a fonte nao diz de que FORMA ela tem de vir. A planta ja declara o abastecimento pela SABESP no quadro de notas, e essa nota e assinada pelo RT junto com o resto da folha. Se ela conta, o item esta atendido; se o DHAP quer papel proprio, nao esta. Chamar de atendido seria decidir pela Prefeitura."
  required_evidence: "Resposta do DHAP no balcao, por telefone ou por e-mail, registrada com a data — ou, mais barato, providenciar a declaracao avulsa e nao depender da resposta."
