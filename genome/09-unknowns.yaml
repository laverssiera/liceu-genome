  why_unknown: "TRES produtores foram medidos pelo Contract Reality Check e os TRES tinham o mesmo defeito, em repositorios diferentes e por maos diferentes: CEFEIDA em `source_refs` (3C273-Analytics-Data-Science, evidence_publisher.py:275, corrigido em db25826), JOHN em `evidence_refs` (John-Brasileiro-, recommendation_publisher.py:319, corrigido em b4cd7b8) e ANCHOR em `policy_refs` (ANCHOR.OS-LICEU6.0, authorization_publisher.py:274, correcao ainda nao mergeada). O JOHN tinha AINDA um quarto ponto, `len(rec.alternatives)` sem guarda (linha 339). Em todos, o vetor de tipo errado num campo de lista produzia TypeError em vez de recusa nomeada: traceback nao diz reason, nem owner, nem missing, e quem chama nao distingue payload invalido de produtor quebrado. Nenhum teste escrito a mao tinha alcancado isso, porque ninguem escreve de proposito um source_refs inteiro. Tres de tres nao e coincidencia; e a probabilidade de os dois produtores nao medidos (hub e archimedes) terem o mesmo defeito que se desconhece. A CLM-0040 esta TESTED apoiada numa unica prova, a PRF-0038, que mediu SO o CEFEIDA — ler isso como cobertura do ecossistema repetiria a CLM-0038, onde guarda verde foi lida como borda fechada. CORRIGIDO em 2026-09-27, e a correcao importa: o padrao NAO e universal. Os cinco publicadores foram medidos, e o `isinstance` ausente apareceu nos TRES que RECEBEM payload — CEFEIDA, JOHN, ANCHOR. Os dois que CONSTROEM o payload (HUB e ARCHIMEDES) nao podem ter esse defeito: eles nunca recebem lista de fora. O HUB falhou por outro caminho (emitia o que o contrato proibe) e o ARCHIMEDES nao falhou. Entao a pergunta que resta e sobre a mesma CLASSE de produtor, e nao sobre todos: opera, cea, legal e authority."
  required_evidence: "Primeiro o produtor tem de existir: hoje a UNK-0012 nao pede medicao, pede CODIGO — nenhum dos quatro publica. Quando um deles ganhar produtor, entra o adaptador do Contract Reality Check na CI do proprio monolito, com a pergunta escolhida pela CLASSE (recebe payload ou constroi, conforme a PRF-0041). Para cada um, o vetor `<campo de lista>: tipo errado` tem de produzir recusa NOMEADA — nunca traceback. MEDIDO em 2026-09-27, e o resultado nao e 'zero defeitos': e NAO MENSURAVEL. Busca pelo event_type de cada um dos quatro nos 19 repositorios nao encontra produtor nenhum — opera.execution.created nao aparece em lugar algum; cea.financial.exposure.assessed e authority.human.decision.recorded aparecem so no kit, onde o evento e validado e nunca publicado; legal.admissibility.assessed aparece no ANCHOR como CONSUMIDOR (authorization_publisher.py:67), o que e pior que ausencia — o elo 4 depende de um fato que nada emite. Registrado na PRF-0044, que estende a refutacao da CLM-0035 ja achada pela PRF-0030. Nao se mede um produtor que nao existe, e confundir 'nao medido' com 'medido e limpo' seria o mesmo erro da CLM-0038, onde guarda verde foi lida como borda fechada. Entao a evidencia que esta incognita pede mudou de dono: ela espera o PRODUTOR existir, e nao um adaptador ser escrito."
