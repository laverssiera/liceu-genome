    pr: 86
  mechanism:
    repo: LICEU_6.0_CONSTRUTORA_VIRTUAL
    paths: [infra/security/uso_de_segredo.py, infra/security/test_uso_de_segredo.py]
    content_hash: "f149e82de17866adcb721c5a29065d8b0c5c8d0b3163fbcd0e5965e79a43dab9"
    commit: "83634c5"
  environment: ci
  date: "2026-10-01"
  location:
    repo: LICEU_6.0_CONSTRUTORA_VIRTUAL
    path: infra/security/uso_de_segredo.py
    note: "TRES CASOS, e o terceiro e o que nenhuma busca por nome literal acha. (1) nome dentro de string de mensagem e MENCAO; (2) nome lido por os.getenv/os.environ e USO; (3) nome que chega por env_prefix sob OUTRO identificador e USO, e e INVISIVEL ao literal. POR QUE AST: a PRF-0069 escreveu a conclusao — 'separar atribuicao de mencao exige analise sintatica, nao regex, e isso e outro trabalho'. E este trabalho. Em arquivo .py o veredito vem da arvore: string literal e no Constant, os.getenv e no Call. Fora do Python valem as formas de consumo conhecidas, e o que nao casa nenhuma vira INDETERMINADO NOMEADO, nunca MENCAO por eliminacao — dizer 'e so mencao' sobre o que nao se leu e a mesma mentira que 'nada encontrado' sobre o que nao se varreu. O ACHADO QUE SO A DERIVACAO PRODUZ, e ele e real e esta em producao de codigo: OPERA_JWT_SECRET e OPERA_CURSOR_SIGNING_KEYS, consumidos em OPERA-ES-LICEU-6.0/apps/opera/core/config.py:61 e :81 via model_config = SettingsConfigDict(env_prefix='OPERA_'). CONFERIDO: grep pelo nome inteiro no repositorio OPERA nao devolve NADA — sao variaveis de ambiente que existem, sao consumidas, e que o inventario nunca teve como ver. E o jwt_secret de la tem default literal 'dev-only-change-me', que e a classe da CLM-0064. O NUMERO QUE MUDA PARA A ROTACAO: os nomes compartilhados caem de 42 para 20 quando se conta quem CONSOME em vez de onde o nome APARECE — um nome citado numa mensagem em cinco repositorios parecia um segredo de raio cinco. CINCO MUTACOES, CINCO QUEDAS: tirar a derivacao do env_prefix derruba 3; string literal virando USO derruba 4; o argumento do getenv contando duas vezes derruba 1; o que nao casa forma nenhuma virando MENCAO derruba 1; e o inventario voltando a contar ocorrencia leva os compartilhados de 20 para 44. CONTROLE POSITIVO com amostra que exercita OS TRES casos, e nao so o que a ferramenta ja acertava — foi assim que o controle da PRF-0055 errou. Mais quatro controles negativos. A ISCA NAO POLUI O QUE MEDE: os nomes das fixtures sao montados por concatenacao, porque a primeira escrita injetou dois nomes novos na contagem do ecossistema — o mesmo defeito do PR 84, cometido de novo e pego pela mesma medicao."

