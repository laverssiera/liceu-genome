  environment: ci
  date: "2026-10-01"
  location:
    repo: LICEU_6.0_CONSTRUTORA_VIRTUAL
    path: infra/security/varredura.py
    note: "A PRF-0074 refutava esta afirmacao com QUATRO varreduras que tratavam item sem resposta como item limpo. Duas foram fechadas em liceu-genome (PR 62); estas sao as outras duas. BORDA: um compose que nao se deixasse ler sumia da conta, e o relatorio seguia anunciando 'N arquivo(s) conferido(s)' com o N da lista PRETENDIDA, nao da lida — compose ilegivel virava 'borda fechada' em silencio, e compose ilegivel pode publicar porta de banco. Agora e NAO MENSURAVEL, com o arquivo nomeado, e saida 2. INVENTARIO, com DOIS silencios e o segundo pior que o primeiro: (1) arquivo ilegivel sumia da conta, e o segredo que estivesse nele nunca entrava no inventario; (2) repositorio ausente imprimia um aviso no MEIO da saida e o relatorio FINAL seguia dizendo 'em 19 repositorios', que e a lista pretendida — rodar com metade dos repositorios fora do disco devolvia um inventario menor anunciado com o mesmo denominador, num instrumento que existe justamente para dizer de QUANTOS repositorios cada segredo depende. A frase passou a ser 'em N repositorio(s) LIDO(S) de 19 pretendido(s)'. varrer() das duas LEVANTA quando a varredura nao mediu: meia varredura nao devolve meia lista como se fosse a lista. SEIS MUTACOES, SEIS QUEDAS: item sem resposta deixando de derrubar a varredura derruba 7; a borda voltando a engolir o erro de leitura derruba 1; o inventario voltando a imprimir-e-seguir derruba 2; o inventario voltando a anunciar o denominador pretendido derruba 1; a borda voltando a aprovar sem medir derruba 1; lista vazia virando MEDIDO derruba 1. CONTROLE POSITIVO em tres: porta exposta e acusada, compose limpo passa, inventario com os 19 presentes mede e acha o segredo. A REGRA E COPIA de liceu-genome/tools/varredura.py, e a razao esta no cabecalho dos dois arquivos: os repositorios nao compartilham pacote, o kit que o monolito instala e de CONTRATOS, e regra de varredura nao e contrato. Se um TERCEIRO repositorio precisar dela, a copia deixa de ser o caminho barato e vira o argumento para um pacote proprio. UM ACHADO DENTRO DO PROPRIO CONSERTO: a primeira versao do teste escrevia o nome de segredo da fixture POR EXTENSO, e com isso o inventario do ecossistema passou de 135 para 136 nomes distintos — um nome novo nascido de um teste. Varredura nao pode poluir o que ela mede; o nome passou a ser montado por concatenacao, o mesmo cuidado que a FIT-015 exige das iscas de dado pessoal, e a medicao voltou a 135. O QUE ESTA PROVA NAO ALCANCA: ela garante que as varreduras ACUSAM o que nao conseguiram ler; nao garante que a LISTA de itens esteja completa. Alvo que nunca entrou na lista continua invisivel — foi o defeito da propria guarda de borda em 2026-09-23."

