    note: "O QUE ESTA PROVA EXPLICA, e e o motivo dela existir: a ausencia de prova em ambiente duravel parecia lacuna do genoma e e CONSEQUENCIA do mundo. O ecossistema vive em CI, efemero e local, e o genoma estava descrevendo corretamente o que existe. Ausencia explicada vale mais que ausencia estranha. O QUE ELA FECHA: a PRF-0064 (borda) e o fechamento da escala em BLOCK (PR 79 do CONSTRUTORA) levantaram a pergunta de se algum ato acima do teto ja teria passado em producao, com o modo padrao em ALERT. A resposta e nao, porque nao ha producao — o PR 79 e puramente PREVENTIVO, que e a melhor forma de ele existir. A consulta que responderia em producao esta registrada no PR 79 e vale para o dia em que houver store duravel. O QUE ELA NAO AFIRMA: que o overlay nao funcione. Ele foi escrito, e a CI testa que ele RECUSA subir sem host — o que e o comportamento certo. Nunca teve host. CONSEQUENCIA PARA A DECISAO DAS TRES PONTAS: nao ha arranjo herdado a acomodar. A decisao e de folha em branco."
