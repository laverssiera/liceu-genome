# F3 (ciclo 15) — a Testemunha passa a olhar. O item (1) do §4, que NAO dependia
# da topologia.
- id: PRF-0065
  kind: proof
  title: "A sonda mede a Ativa pela rede contra socket de verdade, e o plano aceita o que ela mediu"
  proves: [CLM-0059]
  basis: test
  test:
    repo: LICEU_6.0_CONSTRUTORA_VIRTUAL
    path: infra/authority/test_sonda_testemunha.py
    name: "18 testes de unidade contra servidor HTTP real, mais 6 de ponta a ponta em cv-backend-core/tests/test_sonda_atesta_no_core.py"
    pr: 77
  mechanism:
    repo: LICEU_6.0_CONSTRUTORA_VIRTUAL
    paths:
      - infra/authority/sonda_testemunha.py
      - infra/authority/test_sonda_testemunha.py
      - cv-backend-core/tests/test_sonda_atesta_no_core.py
    content_hash: "0d9a54eb04b993ce6d28ece56afbf44c03977258635d74aded10513fccfe1a43"
    commit: "fb0fb0b"
  environment: ci
  scale: LOCAL
  date: "2026-09-30"
  location:
    repo: LICEU_6.0_CONSTRUTORA_VIRTUAL
    path: infra/authority/sonda_testemunha.py
    note: "O ADR-003 §1.4 media a ausencia: 'Nao ha sonda: nenhum codigo no CORE, nem em repositorio algum, em que a Testemunha va ate a Ativa e olhe [...] ela AINDA NAO EXISTE COMO PROCESSO. Existe como segredo.' Agora existe. O §4 diz que a sonda nao depende da opcao de topologia — 'independentemente da opcao' — e por isso este trabalho estava disponivel antes da decisao. TRES ESTADOS, cada ramo com razao propria: alcancada=True exige responder E se identificar, porque alcancar uma porta nao e reconhecer uma instancia; alcancada=False so na RECUSA DE CONEXAO, a unica falha em que o outro lado respondeu dizendo que ninguem escuta; alcancada=None em tempo esgotado, DNS, rede inalcancavel, HTTP 500 (viva e quebrada) e 401/403 (credencial DA SONDA recusada, defeito da sonda e nao estado da Ativa). Chamar 500 de fora autorizaria promocao a partir de erro de servidor, e ACTIVE_DOWN com concordancia PROMOVE. O ENDERECO DA ATIVA vem de configuracao do dominio da Testemunha, nunca do banco: authority_instances nao tem campo de endereco, e isso nao e lacuna — aprender pelo store compartilhado de quem sondar seria depender do store para saber quem observar. MEDIDO CONTRA SOCKET DE VERDADE, e esse e o ponto: ate 2026-09-30 todo active_probe que existiu neste sistema veio de um literal escrito num teste. 18 testes sobem servidor HTTP em 127.0.0.1 ou apontam para porta fechada; 6 de ponta a ponta levam o resultado da sonda — nao um dicionario — ao POST /authority/attest. Suite do CORE 296 -> 308, com as mesmas 26 falhas locais anteriores. MUTACOES: HTTP 500 virando 'fora' derruba 1; responder sem se identificar virando 'alcancada' derruba 2; tempo esgotado virando 'fora' derruba 3. A mutacao do tempo esgotado foi INVALIDA na primeira tentativa — ha DOIS ramos que classificam timeout e eu trocara so um; refeita nos dois, e acrescentados testes que amarram cada ramo. ACHADO DE AMBIENTE: nesta maquina, conectar a porta FECHADA em 127.0.0.1 devolve TimeoutError e nao ConnectionRefusedError, porque algo no caminho DESCARTA em vez de responder com RST. Consequencia registrada no modulo: numa rede que descarta, a sonda nunca emite False, ACTIVE_DOWN nunca nasce da rede, e toda ausencia vira ACTIVE_UNOBSERVABLE — fail-closed, mas significa que failover automatico pode nao acontecer e o caminho e a escalacao ao humano (D-040). Por isso o teste da porta fechada cobra que ela NUNCA seja alcancada e nao que seja False: teste que depende do firewall de quem roda nao guarda nada. O QUE ESTA PROVA NAO ALCANCA, e e a parte que importa: ela NAO toca a CLM-0006. A sonda existe e nao ha Ativa separada para ela olhar — o codigo existe, a separacao nao. Nao entrega o item (2) do §4, 'um lugar proprio para gravar': a atestacao continua indo para o Postgres da Ativa, e o §4 diz que sem (2) 'qualquer opcao grava a declaracao onde a Ativa manda'. Nao detecta Ativa viva e parada (CLM-0058, refutada pela PRF-0060). E nao torna a Testemunha honesta: quem roda o processo pode mentir sobre o que mediu — o que muda e que agora existe o que medir."

# Z1.1 (ciclo 16) — PARADA do Z1. A prova sob particao nao tem alvo.
- id: PRF-0066
  kind: proof
  title: "Nao ha Testemunha no ambiente implantado: uma Ativa, um processo, e os outros dois papeis so em teste"
  refutes: [CLM-0060]
  basis: code_reading
  date: "2026-10-01"
  mechanism:
    repo: LICEU_6.0_CONSTRUTORA_VIRTUAL
    paths:
      - docker-compose.yml
      - .env.example
      - cv-backend-core/app/services/authority_control_plane.py
    content_hash: "0b62c0224650eb246d6a335cf4ead814b612b56c778bbedd50c83ea1d2e8f55e"
    commit: "fb0fb0b"
  location:
    repo: LICEU_6.0_CONSTRUTORA_VIRTUAL
    path: docker-compose.yml
    note: "MEDIDO, nao suposto. (1) UM servico roda o CORE: no docker-compose.yml ha um unico `backend`; nenhum outro compose do repositorio sobe uma segunda instancia. (2) O padrao do codigo semeia UMA Mae: DEFAULT_INITIAL_ROLES = '{\"liceu.authority#mother-a\": \"ACTIVE\"}' em authority_control_plane.py. (3) O .env.example repete o mesmo: AUTHORITY_INITIAL_ROLES={\"liceu.authority#mother-a\": \"ACTIVE\"}. (4) mother-b, mother-witness, SUCCESSOR e WITNESS NAO aparecem em nenhum compose nem em nenhum arquivo de ambiente — so em teste, por monkeypatch. (5) apps/federation-authority nao e o plano de autoridade: nao referencia authority_state nem authority/attest. CONSEQUENCIA: no ambiente implantado nao existe Testemunha nem Sucessora. Existe uma Ativa. E attest() recusaria com only_witness_attests, porque nenhuma instancia tem papel WITNESS semeado. O QUE ISSO RECLASSIFICA: a CLM-0006 nao espera CODIGO, espera INFRAESTRUTURA. A sonda foi construida no ciclo 15 (PRF-0065) e mede socket de verdade; o que falta e a segunda ponta. A prova sob particao real — cortar rede entre Testemunha e Ativa — NAO TEM ALVO: exige dois processos, e ha um. A propria Constituicao diz o que isto significa, no posicionamento da TESTEMUNHA: 'requisito: dominio de falha distinto das duas Maes de autoridade; razao: se as tres compartilham infraestrutura, a testemunha NAO ACRESCENTA INDEPENDENCIA — APENAS CUSTO'. Hoje as tres compartilham tudo, e duas nao existem. A decisao que falta deixa de ser 'escolher topologia A, B ou C' e passa a ser concreta: tres processos em dominios de falha distintos — quanto custa, onde rodam, quem opera."

# Z3 (ciclo 16) — so leitura e citacao, e o que ela apurou vale por si.
- id: PRF-0067
  kind: proof
  title: "A atestacao da Testemunha nao e contrato do kit: e tabela do CORE, fora do alcance do boundary"
  refutes: [CLM-0061]
  basis: code_reading
  date: "2026-10-01"
  location:
    repo: liceu-protocol
    path: liceu_protocol/
    note: "Procurado no kit instalado (KIT_DIR, liceu-protocol): NAO HA contrato de atestacao. O kit tem liceu_contract_registry.yaml, liceu_event_registry.yaml, liceu_producer_registry.yaml, liceu_constitution.yaml e os verificadores — e nenhum contrato para a atestacao da Testemunha. Ela existe como TABELA do CORE (authority_attestations, app/models/authority.py) e como endpoint (POST /authority/attest). CONSEQUENCIA: um ato que a Constituicao poe no caminho da promocao nao passa pelo kit, entao o boundary nao o verifica — nao ha payload_schema, nao ha vetores de contrato, nao ha teto de produtor aplicavel. A FIT-012 e a FIT-018 nao alcancam o que nao esta no registry. O QUE A CONSTITUICAO EXIGE DA TESTEMUNHA, lido no liceu_constitution.yaml, e mais do que vida da Ativa. O `permitido` tem quatro itens: 'observar o estado das duas Maes de autoridade', 'ARBITRAR QUAL DELAS E A ATIVA', 'declarar que ambas estao indisponiveis', 'reunir e apresentar o DOSSIE_DE_DECISAO ao humano'. Arbitrar entre duas e juizo entre candidatas, nao vivacidade de uma. MAS ISSO NAO A TORNA REPLICA, e aqui a assimetria se sustenta: arbitrar pode ser feito SONDANDO AS DUAS e comparando o que cada uma declara ser, sem ler store nenhum. A sonda (PRF-0065) ja devolve reported_instance_id e reported_epoch de cada ponta e ja aceita --sucessora-url. O que ela nao pode fazer so observando e saber se a epoca que lhe disseram e a VIGENTE — essa comparacao e do plano (attestation_epoch_stale), nao dela. Somado ao §2 do ADR-003, que poe a atestacao VIGENTE na camada A linearizavel: a leitura nao exige replica, a ESCRITA exige linearizabilidade. E a PROIBICAO_ABSOLUTA da Constituicao continua de pe — 'a TESTEMUNHA NUNCA autoriza' —, com 'substituir Mae ativa ou sucessora' entre os proibidos."

