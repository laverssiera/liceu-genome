# Ciclo 23 — H1: a medicao do incidente, antes de qualquer conserto.
- id: PRF-0099
  kind: proof
  title: "O inventario procura NOME em maiusculas; o vazamento era VALOR em prosa — e a largura do padrao e no eixo errado"
  refutes: [CLM-0075]
  basis: code_reading
  date: "2026-10-02"
  location:
    repo: LICEU_6.0_CONSTRUTORA_VIRTUAL
    path: infra/security/inventario_segredos.py
    note: "LIDO NA LINHA, e nao lembrado. A linha 40 define SEGREDO como limite de palavra seguido de [A-Z][A-Z0-9_]* contendo SECRET, PASSWORD, PASSWD, TOKEN, API_KEY, PRIVATE_KEY, CREDENTIAL, _PASS ou _KEY. So NOME, e so nome em MAIUSCULAS. A linha 108 define ATRIBUICAO comecando por [A-Z][A-Z0-9_]* antes de dois pontos ou igual: o inventario so chega a um VALOR quando existe um nome assim a esquerda dele. O VAZAMENTO MEDIDO em 2026-10-02 esta em duas formas, e nenhuma e alcancavel: na linha 247 do CANONICAL_FEDERATION_RESTORATION_REPORT.md o valor vem depois de 'X-Canonical-Service-Secret:' dentro de um curl, e cabecalho HTTP tem minusculas e hifens, logo nao casa com [A-Z][A-Z0-9_]*; na linha 87 nao ha atribuicao nenhuma, e celula de tabela markdown, 'API Secret Configured | YES (valor)'. Nao e descuido de configuracao: e construcao. O COMENTARIO QUE A PROVA REFUTA esta duas linhas acima do padrao e e meu: 'Deliberadamente largo: e melhor listar um nome que nao e segredo do que deixar um de fora'. A frase e verdadeira e irrelevante — a largura e no eixo dos NOMES, e o incidente foi no eixo dos VALORES. Afirmacao larga num eixo nao cobre o outro, e por tres ciclos eu relatei a largura sem nomear o eixo. A SEGUNDA GUARDA TAMBEM NAO OLHAVA, por escopo e nao por padrao: a CLM-0017 diz na propria letra 'os repositorios PUBLICOS', e a nota da prova que a sustenta fecha com 'os 15 privados nao sao objeto da CLM-0017 e nao foram varridos por esta prova'. O monolito e private. Uma guarda certa no alvo errado, outra certa no escopo errado, e o vazamento na intersecao dos dois buracos por 39 dias. O QUE EU MESMO ERREI NO DIA, e que e a melhor evidencia de que o limite e real: a primeira medicao desta sessao relatou 81 ocorrencias em 11 repositorios desde 2026-08-22. Errada. O script procurou 'o token com cara de segredo' e travou em X-Canonical-Service-Secret, que tem exatamente 26 caracteres e casa com alfanumerico-mais-hifen — o NOME do cabecalho — e passou ao lado do valor, na mesma linha, depois dos dois pontos. O numero certo e 2 ocorrencias, 1 arquivo, 1 repositorio, 1 commit. O instrumento que cacava segredo achou nome, no dia do incidente, pela mesma razao que o inventario nao viu nada. A GUARDA NAO ENTRA NESTA PROVA, por instrucao do titular: 'A guarda vem depois — e quando vier, com controle positivo cuja amostra contenha um valor colado, e nao so um nome de variavel.' O que falta dela esta na UNK-0017, inclusive a decisao que ninguem tomou: casar por forma e entropia e o que pega senha curta escolhida por pessoa, e e tambem o que produz falso positivo em prosa."

- id: PRF-0100
  kind: proof
  title: "Privado nao e sozinho: 180 checkouts e um Codespace parado leram o arquivo, e os apagados nao sao enumeraveis"
  refutes: [CLM-0076]
  basis: external_observation
  date: "2026-10-02"
  environment: durable
  evidence_artifact: {repo: liceu-genome, path: docs/evidence/2026-10-02-o-valor-colado-que-nenhuma-varredura-ve.md}
  external_observation:
    instrument: "gh api sobre laverssiera/LICEU_6.0_CONSTRUTORA_VIRTUAL em 2026-10-02 — repos/{repo}, /collaborators, /keys, user/codespaces, gh run list --limit 400 filtrado por createdAt a partir de 2026-08-24, grep de uses: nos workflows, git merge-base --is-ancestor"
    observed: "private, 0 forks, 0 watchers, 1 colaborador (laverssiera, admin), 0 deploy keys, nenhuma acao de terceiro, 180 execucoes de workflow na janela de 39 dias, 1 Codespace deste repositorio em estado Shutdown, e0a0f19 ancestral de origin/main; nao enumeraveis: Codespaces apagados e instalacoes de GitHub App (401 sem JWT)"
  location:
    repo: LICEU_6.0_CONSTRUTORA_VIRTUAL
    path: CANONICAL_FEDERATION_RESTORATION_REPORT.md
    note: "O QUE A SUPERFICIE ADMINISTRATIVA DIZ e tranquilizador e insuficiente: um titular, zero fork, zero watcher, zero deploy key, nenhuma acao de terceiro. O QUE A REFUTA sao as 180 execucoes de workflow desde 24/08 — cada uma fez checkout, e checkout escreve o arquivo no disco de um runner que nao e do titular — e um Codespace deste repositorio em estado Shutdown, criado em 2026-03-11, que contem o arquivo. Privado controla quem PODE buscar; nao controla quantas copias a automacao do proprio titular ja fez. UMA CONFERENCIA QUE DIMINUI O RISCO, e foi medida e nao suposta: nenhum passo de workflow nomeia o arquivo nem varre .md, entao o valor nao foi para log de CI por um passo deste repositorio. DOIS CAMINHOS NAO MENSURAVEIS, nomeados em vez de supostos, porque 'nao consegui perguntar' nao e 'nao existe': os Codespaces APAGADOS na janela — a API lista 9 da conta e os destruidos nao aparecem nela — e as instalacoes de GitHub App com leitura, porque repos/{repo}/installation exige JWT de app e devolveu 401. Nao escrevo 'ninguem mais leu'. O QUE VAZOU, por forma e impressao e nunca por valor: 11 caracteres com maiuscula, minuscula, digito e simbolo; sha256 402f633e52d80787...; nao e hex nem base64, logo NAO foi gerado por maquina — e senha escolhida por pessoa, e esse e o achado que a aritmetica do incidente nao alcanca, porque senha de pessoa pode estar em uso fora daqui e nenhuma medicao feita neste repositorio responde onde. A pergunta e do titular. ONDE O SEGREDO E CONSUMIDO: pelo nome CANONICAL_EVENT_STORE_API_SECRET, lido do ambiente em runtime/identity/canonical_federation_client.py linha 34 e verificado com hmac.compare_digest em cv-backend-core/app/core/market_duality.py linhas 322-323. E NENHUM ARQUIVO DE AMBIENTE, em nenhum dos 19 repositorios, atribui valor a esse nome: as duas atribuicoes que existem estao em .env.example e sao VAZIAS (sha256 do vazio, e3b0c44298fc...). Com a CLM-0062 REFUTED, a consequencia e a mesma que o titular tirou da rotacao da OpenAI: nao ha onde revogar porque nao ha servico que aceite, e a prova de revogacao devolveria NAO_MENSURAVEL — que e o resultado certo, nao um resultado baixo. Isso NAO afrouxa a regra que o titular enunciou, 'segredo commitado e segredo comprometido': afrouxa apenas o que a rotacao consegue PROVAR hoje. AS DUAS DECISOES QUE FICAM COM O TITULAR estao no documento de evidencia: reescrever o historico (um commit so, e0a0f19, ancestral de origin/main — e a reescrita derruba a CI de toda prova cujo mechanism aponte para o monolito, pela guarda de superficie) ou aceitar a exposicao por escrito; e se essa senha vive em outro lugar."
