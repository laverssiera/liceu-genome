# Ciclo 13 — a prancha urbanistica aprovada, lida por renderizacao.
- id: PRF-0048
  kind: proof
  title: "O loteamento do fragmento e o VIZINHO: a prancha aprovada declara condominio, e a declaracao da planta continua sendo a errada"
  refutes: [CLM-0050]
  basis: record_reading
  location:
    repo: JURIDICO-TECH
    path: backend/juridicotech/dados/documentos_p001.json
    note: "A prancha do projeto urbanistico do empreendimento nao tem camada de texto: uma pagina de 89x120 cm, uma imagem, ZERO caractere. O OCR automatico devolveu fragmentos sem sentido, inclusive caracteres gregos, e um deles era 'LOTEAMENTO PARQUE DO AGRESTE'. Lida por RENDERIZACAO da imagem oficial a 250-300 dpi por regiao — o mesmo metodo ja usado na Tabela I da lei, e registrado ali como transcricao visual — a prancha diz outra coisa. No carimbo: 'Condominio Residencial de Uso Misto', com certidao do Departamento de Habitacao e Aprovacao de Projetos da PROPRIA Prefeitura e certificado do GRAPROHAB, ambos de 2022. No quadro de areas: 'Area total dos lotes condominiais', com 523 unidades. Na legenda: U.A = Unidade Autonoma, A.U.C = Area Uso Comum, mais Espaco Livre Condominial, Canteiro Central Condominial e Sistema de Lazer Condominial. E o nome do fragmento esta FORA da linha de divisa, na faixa de confrontantes, ao lado dos tabulares e das matriculas dos vizinhos: e o loteamento AO LADO. A licao e sobre extracao parcial: o fragmento nao estava errado, estava SEM CONTEXTO, e fragmento sem contexto inverte conclusao com a mesma facilidade com que a confirma. Consequencia direta: o regime da P-001 deixa de valer pela confirmacao do titular e passa a valer por documento aprovado pela Prefeitura, e a FC-006 fica mais firme, nao menos."
  commit: "73b24a7"
  date: "2026-09-27"

