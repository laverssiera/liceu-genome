confere a data DECLARADA, nao a data VERDADEIRA. Nada impede datar de ontem uma observacao feita hoje — isso exigiria uma fonte de tempo que o autor nao controla, e nao existe aqui. E o passo da CI entra junto com o modulo, porque modulo que a CI nao roda e modulo que ninguem confere."

# Ciclo 19 — o falso verde, e os quatro lugares onde o defeito mora.
- id: PRF-0074
