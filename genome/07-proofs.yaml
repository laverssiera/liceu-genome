    note: "A UNK-0008 registrava que a Tabela I tem uma coluna 'I.E' com valor 4,0 para ZM 'cujo significado nao aparece no texto da lei', e o perfil VGP-LC030-2007-ZM dizia que o LICEU nao a avalia. A prancha-modelo oficial do projeto simplificado do municipio responde as duas coisas que faltavam: o quadro de declaracoes escreve 'IE (Indice de elevacao)', e o quadro de areas traz a conta feita — 'I.E. 205,90 / 205,90 = 1,00' —, de onde a formula e area total construida dividida pela area do pavimento terreo. A planta da P-001 declara I.E. : 1, coerente com a formula e com o quadro de areas dela (97,20 m2 de total num unico pavimento). O que esta respondido e o SIGNIFICADO e a FORMULA. O que NAO esta respondido, e por isso a UNK-0008 se estreita em vez de fechar, e se o 4,0 da linha ZM e maximo, minimo ou exigencia: isso so o texto consolidado da lei diz, e ele continua inexistente. Comparar 1,00 com 4,0 sem saber a direcao do limite seria inventar a regra a partir do numero. O achado tem valor de metodo: a definicao estava fora da lei, no formulario que a propria Prefeitura publica para o ato — ninguem tinha procurado ali porque a pergunta havia sido endereçada so a lei."
