    note: "O TITULAR CONFIRMOU em 2026-10-02 que I.E e 'indice de elevacao', o que a PRF-0047 ja havia derivado da prancha-modelo oficial em 2026-09-27. Mas o significado era METADE da lacuna, e a confirmacao do titular nao fecha a outra metade: a Tabela I traz 4,0 para ZM e nao diz se e maximo, minimo ou exigencia. DOIS DEFEITOS MEDIDOS NO ESTADO ANTERIOR. (1) O perfil ainda dizia 'o significado da sigla nao foi encontrado' e 'o LICEU nao a avalia', cinco dias depois de o significado ter sido derivado de fonte oficial: lacuna desatualizada manda procurar o que ja foi achado. (2) O indice ficava FORA da lista de itens, e isso e pior do que sair INDETERMINADO — indice que nao aparece no relatorio nao tem lacuna visivel, e a CLM-0020 exige falta NOMEADA. O TIPO NOVO, direcao_desconhecida: viola() LEVANTA em vez de devolver False, porque devolver False faria o item sair ATENDE por omissao — a mesma traducao de 'nao sei' em 'esta tudo bem' que o ACTIVE_UNOBSERVABLE, o INDETERMINADO da borda e o NAO_MENSURAVEL da varredura recusam; folga() devolve None, porque folga e distancia ate violar e sem saber de que lado se viola nao ha distancia, e devolver 3,0 sugeriria conforto inexistente. O NUMERO QUE MOSTRA POR QUE: o projeto declara I.E = 1,0 e a norma traz 4,0. Com tipo maximo, 1,0 sai ATENDE com folga de 3,0; com tipo minimo, sai NAO_ATENDE. As duas conclusoes saem do MESMO numero, e e por isso que nenhuma vale. DUAS MUTACOES, DUAS QUEDAS: tratar direcao_desconhecida como maximo derruba 2; viola() devolvendo False derruba 1. CONTROLE: maximo e minimo seguem concluindo com folga e veredito — trocar os dois pelo tipo novo deixaria tudo INDETERMINADO e os casos de cima passariam. DOIS TESTES ANTIGOS CAIRAM, e o primeiro e uma GUARDA DE PRIVACIDADE funcionando: a lista branca de parametros do projeto recusou o campo novo por nao estar nela. Acrescentar campo ali virou ato deliberado e revisado, que e para isso que o teste existe. O caso real NAO muda de veredito: segue INDETERMINADO, agora com cinco faltas nomeadas em vez de quatro, e os cinco dizem faltas de tipos DIFERENTES — duas de aplicabilidade (limite de LOTE em projeto CONDOMINIO), duas de dado ausente no projeto, uma de direcao de limite. O QUE ISTO NAO ALCANCA: a UNK-0008 nao fecha. Ela se estreita de novo — significado e formula resolvidos, direcao do 4,0 em aberto —, e so o texto consolidado oficial fecha, exatamente como o required_evidence dela diz desde 2026-09-27."

