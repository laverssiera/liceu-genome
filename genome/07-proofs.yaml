# A contagem da borda, refeita: a PRF-0033 subcontou 9.
- id: PRF-0040
  kind: proof
  title: "Sao 137 portas de servico de estado publicadas fora do loopback, e 119 continuam abertas — a PRF-0033 subcontou 9"
  refutes: [CLM-0038]
  supersedes: [PRF-0033]
  basis: record_reading
  location:
    repo: LICEU_6.0_CONSTRUTORA_VIRTUAL
    path: docs/security/2026-09-23-F0A-inventario-e-F0B-borda.md
    note: "A PRF-0033 registrou 128 no ecossistema e 110 restantes. Os dois numeros estavam errados, por 9; os corretos sao 137 e 119. O que estava CERTO era o CORE: 18 exposicoes, distribuidas 6/6/4/2, reproduzidas a partir dos quatro arquivos que o commit 8144588 alterou — entao o fechamento da borda do CORE, que a PRF-0033 tambem afirma, continua valendo. Os 119 foram medidos por TRES metodos independentes: varrer() por repositorio, varrer() na arvore inteira de uma vez, e um grep cru que nao usa o scanner. Os tres deram 119, em 14 repositorios (BIM 16, P-D 16, HUB 12, ANCHOR 11, Archimedes 10, John 10, CEA 9, OPERA 7, ECONO 6, ACADEMIA 6, 3C273 4, FORNECEDORES 4, GAME-MKT 4, JURIDICO-TECH 4). Os quatro repositorios que divergiam tem todos os arquivos rastreados pelo git, estao em origin/main sem alteracao pendente, e seus ultimos commits sao de 20 e 22 de setembro: o codigo NAO mudou entre as duas medicoes, e o scanner tem um unico commit. A causa exata da subcontagem nao e reconstruivel, porque o JSON da varredura original nunca foi commitado — so o markdown; inventar uma causa seria pior que registrar a lacuna. O que a investigacao encontrou no mesmo verificador foi um defeito da mesma familia, e esse foi fechado: varrer() num caminho inexistente devolvia lista vazia e o programa anunciava borda fechada com saida 0. Ele nao explica a subcontagem — raiz inexistente zeraria um repositorio inteiro, nao tiraria 2 de um e 4 de outro. A CLM-0038 continua REFUTED, e por mais do que se acreditava."
  commit: "9e8a19f"
  date: "2026-09-23"

