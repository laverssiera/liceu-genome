    note: "Quatro decisoes: o veredito sai do corpo e vira derivacao (derive_verdict, pura); ACTIVE_UNOBSERVABLE entra e nao autoriza promocao em DUAS camadas (attest recusa concordancia sobre ele, valid_attestation_for recusa a linha); dizer que a Ativa esta sa exige dizer QUEM foi visto, e instancia vista diferente da registrada e divergencia de autoridade e nao atestacao de saude; e nao se avaliza Sucessora que a sonda nao alcancou, nem sonda de OUTRA instancia. MEDIDO: suites de autoridade 32 -> 39; suite inteira do CORE 26 falhas antes e 26 depois com conjuntos IDENTICOS (diff vazio, sao locais e anteriores), 280 -> 287 passando, zero regressao. SEIS MUTACOES, seis pegas: extra=ignore 1 cai; UNOBSERVABLE virando ACTIVE_DOWN 3 caem; sem conferir identidade da Ativa 1 cai; avalizar quem nao se alcancou 1 cai; sonda de outra instancia 1 cai; segunda camada em valid_attestation_for 1 cai. TRES testes meus passaram pelo motivo ERRADO antes de virarem guarda, e os tres so apareceram porque a mutacao os desmentiu — atestacao AUSENTE tambem bloqueia promocao, o 422 do pydantic ecoa o corpo e casa qualquer substring, e o corpo antigo sem active_probe ja falhava por campo obrigatorio. O padrao e sempre o mesmo: o teste e o defeito produzem o MESMO sinal, e so a mutacao separa os dois. O QUE ESTA PROVA NAO ALCANCA: a sonda e auto-reportada e nao torna a Testemunha honesta; quem minta sobre o que mediu produz atestacao valida. Ela prova que o plano recusa promover sem observacao, nao que houve observacao."

