    note: "MEDIDO ao escolher o alvo da primeira rotacao. DOIS segredos do ecossistema tem valor literal no proprio codigo, entao trocar a variavel de ambiente NAO revoga o anterior — um processo que suba sem a variavel continua aceitando o valor que esta no git. (1) BIM.ARQ.ENG: config.py:21 traz LICEU_SERVICE_TOKEN: str = 'liceu-master-key', e auth.py:11 compara com 'if token != settings.LICEU_SERVICE_TOKEN'. (2) ECONO.TECH: app/security.py:12 traz DEFAULT_API_KEY = 'dev-econo-key' e :23 faz os.getenv('ECONO_API_KEY', DEFAULT_API_KEY). E A MESMA CLASSE que foi fechada no Archimedes em 2026-09-30 (PR 39 daquele repositorio), onde ARCHIMEDES_JWT_SECRET tinha fallback 'ARCHIMEDES_SECRET' publicado tambem no .env.example. CONSEQUENCIA PARA A F0-C: rotacionar um destes dois produziria DUAS falhas de uma vez — a revogacao nao ocorreria, e a crenca de que ocorreu. A prova de revogacao (PRF-0071 em diante) devolveria NAO_REVOGADA, que e o veredito certo, e seria a primeira vez que o instrumento acusa uma credencial nao revogavel. Eles sao candidatos a rotacao DEPOIS de fechar o fallback, nao antes. UM TERCEIRO ACHADO, no candidato escolhido: o LEGAL_AI_OPENAI_API_KEY nao tem fallback literal — vazio desliga a funcao. Mas a degradacao so e graciosa para chave AUSENTE, nao para chave REVOGADA: em rag.py, _init_llm() retorna cedo quando a chave e vazia e o modo simulado assume; com chave presente mas revogada, ChatOpenAI CONSTROI sem validar, _llm fica setado, e _llm_answer nao tem try/except — a excecao propaga. E nao ha teste do modo simulado. Isso reforca a ordem da rotacao: criar e provar a nova ANTES de revogar a antiga, porque o codigo degrada da ausencia e nao da revogacao."

# B3 (ciclo 18) — a diferenca entre "nao configurei" e "configurei e deixou de valer".
- id: PRF-0071
  kind: proof
  title: "A degradacao cobre a configuracao, nao a invalidacao: chave ausente cai no modo simulado, chave revogada levanta"
  refutes: [CLM-0065]
  basis: code_reading
  date: "2026-10-01"
  location:
    repo: JURIDICO-TECH
    path: apps/legal-ai/legal_ai/rag.py
    note: "MEDIDO ao preparar a primeira rotacao, e o achado vale por si — nao depende de rotacao nenhuma. DOIS ESTADOS, DOIS COMPORTAMENTOS. Chave AUSENTE ou vazia: _init_llm() tem 'if self._llm or not self.settings.openai_api_key: return', entao _llm fica None, e answer() cai em _simulated_answer(). Degrada com graca, e ate declara model='simulated' na resposta. Chave PRESENTE mas REVOGADA: ChatOpenAI CONSTROI sem validar a credencial — construcao nao faz chamada —, _llm fica setado, answer() escolhe o ramo do LLM, e _llm_answer() nao tem try/except: 'result = await self._llm.ainvoke(messages); return result.content'. A excecao de autenticacao PROPAGA. A DIFERENCA QUE IMPORTA: a degradacao cobre 'nao configurei' e nao cobre 'configurei e deixou de valer'. E o segundo e o caso comum no mundo real — expiracao, suspensao de conta, revogacao pelo proprio provedor, rotacao do lado de quem emite. Nenhum deles chega como chave vazia; todos chegam como chave presente e recusada. E NAO HA TESTE do modo simulado: nem do ramo gracioso, nem do que levanta. CONSEQUENCIA PARA A ROTACAO: torna OBRIGATORIA — nao apenas preferivel — a ordem de criar e provar a chave nova ANTES de revogar a antiga. Revogar primeiro deixaria o servico levantando excecao em vez de degradando, com a variavel ainda apontando para a chave morta. O QUE EU NAO CONSEGUI MEDIR: se o padrao se repete no ecossistema. Seis arquivos instanciam cliente de LLM externo (ChatOpenAI, OpenAIEmbeddings, OpenAI(), AsyncOpenAI(), Anthropic()) e TODOS OS SEIS tem 'try:' em algum lugar do arquivo — sinal que nao responde nada, porque o proprio rag.py tem try: no _init_llm e NAO no _llm_answer, que e onde o defeito mora. Contar try: por arquivo e medicao falsa; responder exigiria olhar cada chamada. Fica declarado como nao medido, e nao como ausencia de defeito."

# Ciclo 19 — o buraco, lido no juiz antes da correcao.
- id: PRF-0072
  kind: proof
  title: "O juiz comparava datas como texto e nao conferia nenhuma: forma, calendario, futuro e fuso"
  refutes: [CLM-0066]
  basis: code_reading
  date: "2026-10-01"
  location:
    repo: liceu-genome
    path: tools/genome_check.py
    note: "MEDIDO no commit c446b90, ao conferir o grafo para o relatorio do ciclo 18 — nao ao procurar defeito. O schema declarava os quatro campos de data como 'type': 'string' e MAIS NADA: nenhum pattern, nenhum format. E toda comparacao de data no juiz e comparacao de TEXTO, medida linha por linha: _expired() faz `str(exp) < today`; a FIT-016 faz `p['date'] < pred['registered_at']` (linha 735); a historia ordena por `str(x.get('date'))` (linha 496) e calcula o 'ate' da supersessao por data (linha 499). QUATRO CONSEQUENCIAS. (1) FORMA: '2026-9-30' e MAIOR que '2026-09-30' em texto e MENOR no calendario — a inversao nao levanta excecao nenhuma. (2) CALENDARIO: '2026-02-30' nao existe e nada o recusava. (3) FUTURO: prova datada de depois de hoje e observacao que ainda nao foi feita, e na FIT-016 a data futura AFROUXA a regra, porque la a pergunta e se a prova veio DEPOIS do pre-registro: quanto mais tarde a prova se declara, menos ela parece explicacao depois do ocorrido. (4) FUSO: `datetime.date.today()` devolve a data do fuso de QUEM RODA. A CI roda em UTC e a maquina de quem escreve em UTC-3: entre 21h e meia-noite local os dois discordam sobre que dia e hoje, e o mesmo grafo receberia dois vereditos. O QUE O BURACO JA TINHA PRODUZIDO, medido e nao suposto: duas fixtures do proprio teste do juiz estavam datadas de 2026-12-01, no futuro — test_56 e test_58 em tools/test_genome_check.py. Elas precisavam ser POSTERIORES ao pre-registro de 2026-09-22, nao estar no futuro, e passaram meses sem que nada as questionasse. UMA CORRECAO QUE ESTA PROVA REGISTRA CONTRA SI MESMA: o relatorio que motivou este trabalho afirmou que SEIS provas do grafo estavam datadas do futuro (PRF-0066, 0067, 0069, 0070, 0071 e uma sexta). ERRADO. Aquela leitura foi feita as 23h26 de 2026-09-30 em UTC-3, quando em UTC ja era 2026-10-01: as seis estavam datadas do dia corrente, e nao do futuro. A afirmacao foi um sintoma do mesmo defeito que ela denunciava — ler data sem declarar o fuso. O grafo nunca teve prova datada do futuro; o juiz e que nao tinha como saber."

