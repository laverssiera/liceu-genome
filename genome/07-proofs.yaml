    note: "A AFIRMACAO E REFUTADA PELO PROPRIO DESENHO DA ROTACAO, e o titular viu isso antes de criar a chave: sem ambiente implantado (CLM-0062 REFUTED), a chave 2 e a chave 3 nao servem a nada no mundo — existem para o instrumento medir aceitacao e depois recusa. O que as retirava do provedor era alguem lembrar, e lembrar nao e mecanismo. A regra que o titular mesmo escreveu um ciclo antes se aplica: isso merece virar GUARDA, nao lembrete. O QUE ENTROU: --proposito-prova marca as credenciais da execucao, e vale para as DUAS, porque sem a marca a chave NOVA sairia da cobranca justamente por ser a que fica viva no fim; --pendentes lista as de prova cuja ultima medicao diz ACEITA, por IMPRESSAO sha256 e nunca por valor, e sai com codigo 1, porque divida aberta nao e sucesso. E O CICLO FECHA SOZINHO: a prova agora GRAVA o que mediu de volta na linha de base, entao depois do passo 7 a chave velha foi medida como recusada e SAI da cobranca, e a nova foi medida como aceita e ENTRA. Ninguem da baixa a mao, e a ferramenta nunca cobra eternamente algo que ela mesma acabou de ver morrer. DUAS DECISOES QUE O DESENHO PRECISOU TOMAR. O proposito e propriedade da CREDENCIAL e nao da medicao: medicao posterior que nao o informe HERDA o anterior, porque sem isso a divida desapareceria exatamente quando a credencial fosse medida de novo — e a prova mede as duas a cada execucao. E credencial SEM proposito nao e divida: chamar de pendencia uma credencial de producao em uso seria pedir que alguem derrube o que esta funcionando. CINCO MUTACOES, CINCO QUEDAS: pendentes ignorando o proposito derruba 1; pendentes cobrando tambem as recusadas derruba 2; o proposito deixando de ser herdado derruba 1; a prova deixando de marcar a nova derruba 1; divida aberta saindo com codigo zero derruba 1. ENSAIO DO CICLO INTEIRO em JWT com chaves de teste: registrar a chave 2 como prova, rodar o par, veredito REVOGADA, e a divida passa da 2 para a 3 automaticamente. O QUE ISTO NAO ALCANCA: a lista conhece so as credenciais que PASSARAM por este arquivo. Credencial de teste criada fora dele continua invisivel, e a saida diz isso com estas palavras — 'isto NAO afirma que nao existem credenciais de teste vivas: afirma que nenhuma das que ESTE arquivo conhece esta nesse estado'. E a mesma distincao entre varredura completa e varredura honesta da CLM-0067."

