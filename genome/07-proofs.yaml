# A PRF-0015 dizia: attest() recebe o veredito pronto no corpo do POST. Isso
# deixou de ser verdade. A CLM-0006 continua REFUTADA — por outro motivo, mais
# estreito, e e esse estreitamento que esta prova registra.
- id: PRF-0058
  kind: proof
  title: "O veredito deixa de vir do corpo, e ainda assim a Testemunha nao observa de forma independente"
  refutes: [CLM-0006]
  supersedes: [PRF-0015]
  basis: code_reading
  date: "2026-09-30"
  mechanism:
    repo: LICEU_6.0_CONSTRUTORA_VIRTUAL
    paths: [cv-backend-core/app/services/authority_control_plane.py]
    content_hash: "012541713ff8a7258cd2b83897c0b2b27d43e29091bae60a542be31f74c20465"
    commit: "1991e4e"
  location:
    repo: LICEU_6.0_CONSTRUTORA_VIRTUAL
    path: cv-backend-core/app/services/authority_control_plane.py
    note: "O QUE MUDOU desde a PRF-0015: attest() nao recebe mais verdict. Recebe active_probe e successor_probe e DERIVA o veredito em derive_verdict(), funcao pura. O corpo do POST passou a extra=forbid, entao cliente que ainda mande verdict leva 422 em vez de ser ignorado calado. Entrou ACTIVE_UNOBSERVABLE, o estado que faltava: antes, Testemunha sem rota ate a Ativa tinha de escolher entre sa e morta, escolheria morta, e ACTIVE_DOWN com concordancia PROMOVE — incapacidade de observar virava autorizacao para trocar a Mae. O QUE NAO MUDOU, e por isso a CLM-0006 segue refutada: nao ha leitura da Ativa pela rede em lugar nenhum do CORE. Os campos reached, reported_instance_id e reported_epoch sao preenchidos pelo PROPRIO chamador — a sonda e auto-reportada. Pela FIT-013 continua sendo campo asserted sustentando promocao de autoridade; o que mudou e a FORMA do asserted, de conclusao para medida, nao a sua natureza. E Testemunha e Ativa seguem no mesmo processo: um ACTIVE_UNOBSERVABLE que nunca ocorre nao prova nada, so mostra que ninguem esteve em condicao de nao enxergar. Observar de forma INDEPENDENTE exige separacao fisica, que e decisao de topologia e segue em aberto. Esta prova NAO move a cadeia e NAO desbloqueia REGIONAL, que continua barrada por 4 itens."

