    note: "Tres fontes, nenhuma delas a palavra de quem mediu. (1) A RELACAO DE DOCUMENTOS do DHAP, sha256 48269f22968e242e2077737352f695cd37c210bf90111a867a343305137de579, reconferido em 2026-09-27 baixando de novo do mesmo URL — bate byte a byte com o que o genoma ja declarava. Ela tem uma linha por servico: 'Construcao Residencial  1 2 4 5 6 7 8 13 14 17 20' e 'Certidao de Diretrizes  1 2 6 20 26'. Sao servicos IRMAOS, nao etapas um do outro: nenhum dos onze itens da Construcao Residencial e certidao, e a RELACAO nao poe a Certidao como pre-requisito de nada. (2) A ART do projeto declara a finalidade em texto: 'Processo para aprovacao de projeto e execucao de Obra'. (3) A prancha-modelo oficial do municipio se intitula 'PROJETO SIMPLIFICADO - CONFORME DECRETO 054/2017'. O que esta REFUTADO e a CLM-0032, que punha a Certidao como oraculo que responderia a UNK-0008 e a UNK-0009 antes do protocolo. O que NAO esta refutado e a CLM-0034: o procedimento da Certidao continua derivado de fonte oficial legivel por maquina, e continua certo sobre a Certidao — errado era o lugar dela no caminho. A licao e sobre o custo: um ciclo inteiro de trabalho foi gasto num oraculo barato que nao era etapa de nada, e nada no metodo pegou isso, porque ninguem tinha conferido a linha do servico que a P-001 de fato pratica. Medir a fonte certa e mais barato que provar bem a coisa errada."
