# Ciclo 20 (D3) — a regra, com os tres casos no controle positivo.
- id: PRF-0083
  kind: proof
  title: "Uso x mencao pela ARVORE, e o nome do env_prefix DERIVADO: dois segredos reais que nenhuma busca por literal achava"
  proves: [CLM-0069]
