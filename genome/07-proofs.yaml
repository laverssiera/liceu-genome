- id: PRF-0050
  kind: proof
  title: "A fonte de um requisito e o documento MAIS os instrumentos que o alteram — e o que o decreto pode alterar nao e a tabela dos indices"
  refutes: [CLM-0051]
  basis: record_reading
  location:
    repo: JURIDICO-TECH
    path: backend/juridicotech/dados/vgp_lc030_2007_zm.json
    note: "O Decreto municipal 095, de 18 de marco de 2013, altera a lei de uso e ocupacao do solo SEM passar por lei nova, e diz por que pode: 'CONSIDERANDO, que a Lei Complementar no 30, de 13 de dezembro de 2007, que dispoe sobre o Uso e Ocupacao de Solo, em seu artigo 8o § 2o, autoriza a reformulacao atraves de Decreto.' Refuta a CLM-0051: acompanhar a lei nao basta, porque um decreto pode mudar o que ela exige, e a lista de alteracoes que a Camara publica e de LEIS. Mas o achado tem um segundo lado, e ele e o que impede o erro simetrico: o que o art. 8o § 2o autoriza reformular e o 'ANEXO I — Enquadramento de Atividade Economica', a tabela de CNAE e categorias de uso (R1 unifamiliar, R2 multifamiliar, R3 misto, R4 conjunto residencial e condominios), e o Art. 1o do decreto altera exatamente esse anexo. A TABELA I — RESTRICOES URBANISTICAS DE USO, de onde saem T.O, C.A, T.P, area minima e a coluna I.E, e outra peca, e ela foi substituida pela LC 99/2021, que e LEI COMPLEMENTAR. Entao os indices da P-001 nao estao sujeitos a mudanca silenciosa por decreto, e o enquadramento de uso esta. Estender o achado da tabela de uso para a tabela de indices seria inventar exposicao que nao existe; ignora-lo seria manter uma fonte incompleta. A UNK-0008 passa a pedir a cadeia de instrumentos, e nao so a cadeia de leis."
  commit: "73b24a7"
  date: "2026-09-27"

