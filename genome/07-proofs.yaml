    note: "liceu.cefeida.evidence@2.0.0 ganhou allOf/if/then — evidence_kind = FORECAST exige confidence E horizon — e `_ajustar` passou a validar cada vetor com jsonschema, usando os erros de `required` para acrescentar o que o esquema exige condicionalmente. Quem responde e a validacao, e nao uma leitura do esquema, entao vale para qualquer construto. Quatro casos novos no self-test do kit 0.18.0: o valido de FORECAST ja nasce com o campo exigido; a condicional vira vetor INVALIDO (a regra virou teste); nenhum valido do gerador e recusado pelo proprio esquema; e o produtor passa SEM a valvula. Medido contra o produtor real, sem `condicionais`: 0 recusas indevidas, e os mesmos 7 casos deixados para o boundary. Dois acertos de prosa junto: a prosa dizia `kind` e o campo se chama `evidence_kind`, e o `horizon` nao estava em domain_invariants — estava na `description` do campo, esconderijo que nenhuma fitness olha. A 1.0.0 esta RETIRED e nao foi tocada: reescrever versao aposentada seria mudar o que ja foi publicado, e a VIO-0008 dela continua no livro. SUPERFICIE REFEITA em 2026-09-23 (commit 997be94, kit 0.19.0): o gerador aprendeu a reparar minItems e a derivar o invalido por MUTACAO, e nao so do reparo — sem isso, uma condicional que o payload minimo ja satisfazia nao virava vetor nenhum. Rodada de novo: 18/18 no self-test. Esta prova e a PRF-0039 cobrem O MESMO arquivo, entao se refazem sempre juntas; e correto, porque as duas falam do comportamento dele. SUPERFICIE REFEITA de novo em 2026-09-23 (commit 3380112, kit 0.21.0): o gerador passou a construir um vetor que ACIONA cada condicional — sem ele, a regra entra no contrato e nada a exercita, porque o payload minimo nao satisfaz o `if`. Junto vieram `contains`/`anyOf` no _exemplo e a correcao de um bug: `_ajustar` reparava no TOPO um `required` vindo de dentro de um item de array, inventando campo que o contrato nao declara. Rodada de novo: 22/22."
  commit: "a7272a0"
