    name: _self_test
    pr: 20
  environment: ci
  location:
    repo: liceu-protocol
    path: liceu_protocol/liceu_contract_vectors.py
    note: "Onze casos, rodados pela CI do kit em todo push e PR. Os dois que sustentam esta prova: um produtor que exige value numerico — o defeito exato do CEFEIDA que travou o elo 2 — e PEGO pelos vetores de uniao de tipos ('RECUSA O QUE O CONTRATO ADMITE', tipo string e tipo object); e a valvula condicional tem os dois lados testados, o que a declara com citacao tira o falso positivo do FORECAST, e o que NAO a declara volta a acusar a mesma recusa. A valvula nao e silenciosa por construcao, e nao por intencao. Os demais casos cobrem o gerador: uniao de tipos, enum, opcional, o limite exato de minItems, obrigatorio ausente, campo a mais e array vazio. SUPERFICIE REFEITA em 2026-09-23 (commit c1dcbe4, kit 0.18.0): o gerador passou a validar cada vetor com jsonschema, entao ele agora LE as condicionais do esquema em vez de adivinhar — e por isso a superficie mudou. Aqui o detector nao foi ruido: o que mudou foi exatamente o que esta prova cobre, e ela foi RODADA de novo. Os dois casos que a sustentam continuam no self-test, agora entre quinze, e o kit 0.19.0 os roda na CI a cada push. SUPERFICIE REFEITA em 2026-09-23 (commit 997be94, kit 0.19.0): o gerador aprendeu a reparar minItems e a derivar o invalido por MUTACAO, e nao so do reparo — sem isso, uma condicional que o payload minimo ja satisfazia nao virava vetor nenhum. Rodada de novo: 18/18 no self-test. Esta prova e a PRF-0039 cobrem O MESMO arquivo, entao se refazem sempre juntas; e correto, porque as duas falam do comportamento dele. SUPERFICIE REFEITA de novo em 2026-09-23 (commit 3380112, kit 0.21.0): o gerador passou a construir um vetor que ACIONA cada condicional — sem ele, a regra entra no contrato e nada a exercita, porque o payload minimo nao satisfaz o `if`. Junto vieram `contains`/`anyOf` no _exemplo e a correcao de um bug: `_ajustar` reparava no TOPO um `required` vindo de dentro de um item de array, inventando campo que o contrato nao declara. Rodada de novo: 22/22."
  commit: "ed66247"
  date: "2026-09-23"
  mechanism:
    repo: liceu-protocol
    paths:
    - liceu_protocol/liceu_contract_vectors.py
    content_hash: 95753bb4d3bcebec59430941b528e9f10cba3d57dafafbb67c2b3262bdaa8ff3
    commit: "3380112"

