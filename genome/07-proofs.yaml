# B3 (ciclo 11) — o que os vetores acharam na primeira execucao.
- id: PRF-0035
  kind: proof
  title: "O CEFEIDA explode com TypeError no vetor `source_refs: tipo errado`, em vez de recusar com motivo nomeado"
  refutes: [CLM-0040]
  basis: code_reading
  location:
