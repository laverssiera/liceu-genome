# A1 (ciclo 11) — o procedimento do oraculo. PROPOSTA: VIGENTE exige dono e revisor.
- id: CASO-P001-CERTIDAO
  kind: knowledge
  title: "Certidao de Diretrizes urbanistica no DHAP de Vargem Grande Paulista — o procedimento"
  knowledge_type: journey
  validity: PROPOSTA
  permitted_uses: [exploration, design_reference, research, comparison_as_proposal]
  prohibited_uses: [authoritative_decision, authoritative_budget, procurement_commitment, physical_execution_authorization]
  source: {repo: JURIDICO-TECH, path: backend/juridicotech/dados/certidao_diretrizes_vgp.json, note: "Derivado de duas fontes oficiais com URL e sha256: a RELACAO DE DOCUMENTOS do DHAP e o REQUERIMENTO DHAP. Cinco documentos (1, 2, 6, 20, 26), um pedido por processo, e o requerimento com a caixa 'Urbanistica'. Prazo NAO declarado. Tres dos cinco documentos carregam dado pessoal e por isso ficam com o titular: pedir e ato do RT, nao do LICEU. CORRECAO DE PREMISSA em 2026-09-27: este procedimento NAO esta no caminho da Casa P-001. O que esta escrito aqui sobre a Certidao continua certo — ela existe, e servico do mesmo DHAP e exige estes cinco itens —, mas ela nao e etapa do processo da P-001 e nao e o oraculo dos indices. A mesma RELACAO de onde estes cinco itens saem tem outra linha, a de Construcao Residencial, com onze itens, e nenhum deles e certidao. O no fica: saber que um caminho existe e nao serve tem valor, e apagar apagaria tambem a licao. Ver CASO-P001-PROTOCOLO e a PRF-0045."}

# A1 (ciclo 11, correcao de premissa) — o ato REAL do caminho da P-001, e o
# relogio dele: a montagem do conjunto. PROPOSTA: VIGENTE exige dono e revisor.
- id: CASO-P001-PROTOCOLO
  kind: knowledge
  title: "Protocolo do projeto simplificado no DHAP de Vargem Grande Paulista — os onze itens de Construcao Residencial"
  knowledge_type: journey
  validity: PROPOSTA
  permitted_uses: [exploration, design_reference, research, comparison_as_proposal]
  prohibited_uses: [authoritative_decision, authoritative_budget, procurement_commitment, physical_execution_authorization]
  source: {repo: JURIDICO-TECH, path: backend/juridicotech/dados/protocolo_construcao_residencial_vgp.json, note: "O ato e a aprovacao do projeto E da execucao da obra, pelo projeto simplificado do Decreto municipal 054/2017. A fonte e a RELACAO DE DOCUMENTOS do DHAP (sha256 48269f22968e242e2077737352f695cd37c210bf90111a867a343305137de579, reconferido em 2026-09-27 baixando de novo: bate byte a byte), linha 'Construcao Residencial  1 2 4 5 6 7 8 13 14 17 20'. O relogio do processo esta no rodape da mesma fonte: 'Os Pedidos so serao protocolados se os documentos exigidos estiverem anexos ao processo' — falta um, nao ha protocolo. Outro rodape separa o que impede de protocolar do que impede de APROVAR: a renovacao do registro profissional para o ano corrente e 'condicao para a referida aprovacao', e por isso nao e impedimento de protocolo. Tres dos onze itens ficam com o titular por carregarem dado pessoal. Nenhum item e ato do LICEU: quem protocola e o RT."}

# B1 (ciclo 11) — o inventario de segredos. NOME e ALCANCE, nunca valor: o
# genoma e publico, e fingerprint de segredo tambem e segredo quando o segredo
# e curto. Aqui nao ha nem fingerprint — ha contagem.
- id: F0A-INVENTARIO-SEGREDOS
  kind: knowledge
  title: "F0-A — segredos compartilhados entre repositorios, por alcance"
  knowledge_type: norm
  validity: PROPOSTA
  permitted_uses: [exploration, design_reference, research, comparison_as_proposal]
  prohibited_uses: [authoritative_decision, authoritative_budget, procurement_commitment, physical_execution_authorization]
  source: {repo: LICEU_6.0_CONSTRUTORA_VIRTUAL, path: infra/security/inventario_segredos.py, note: "101 nomes de segredo distintos nos 19 repositorios; 17 aparecem em mais de um. Por alcance: POSTGRES_PASSWORD 14, NEO4J_PASSWORD 12, CANONICAL_EVENT_STORE_API_SECRET 11 (o legado), GF_SECURITY_ADMIN_PASSWORD 7, FEDERATION_SECRET 5, JWT_SECRET 5. GH_TOKEN aparece em 18 e NAO e segredo compartilhado: e o token por repositorio da CI, e esta listado para nao ser confundido com um. Tres arquivos .env morreram com Codespaces apagados em 2026-09-22 e nao foram salvos — apagar ambiente nao revoga credencial. O scanner e reproduzivel e nunca imprime valor."}

# Ciclo 13, DESENHO PENDENTE — nao e tipo de no, e nao vira tipo de no enquanto
# o numerador nao mudar. Fica registrado com os tres casos reais ja levantados,
# para que o dia em que entrar nao comece do zero. PROPOSTA: nao pode ter dono.
- id: PADRAO-EXIGE-EMITE-COMPROVA
  kind: knowledge
  title: "Quem EXIGE nao e quem EMITE nem quem COMPROVA — o padrao que apareceu tres vezes na mesma semana"
  knowledge_type: stakeholder
  validity: PROPOSTA
  permitted_uses: [exploration, design_reference, research, comparison_as_proposal]
  prohibited_uses: [authoritative_decision, authoritative_budget, procurement_commitment, physical_execution_authorization]
  source: {repo: liceu-genome, path: genome/04-knowledge.yaml, note: "Tres casos reais do protocolo da P-001, todos derivados de documento, todos com o mesmo formato: o papel de EXIGIR, o de EMITIR e o de COMPROVAR caem em atores diferentes, e o modelo atual so tem 'quem_tem'. (1) CADERNETA DE OBRAS — exige o municipio, emite a Associacao de Engenheiros e Arquitetos, comprova o RT. (2) ESGOTO, item 13 — exige o municipio, satisfaz o condominio com estacao propria aprovada pelo GRAPROHAB, e comprova a unidade, que nao tem sistema nenhum para calcular. (3) APROVACAO DO PROJETO — quem aprova ANTES da prefeitura e o condominio, e uma exigencia da prefeitura que afete o projeto devolve o processo a aprovacao condominial. O que o padrao explicaria e por que 'estado do item' nao basta: um item pode estar parado sem que o dono aparente possa fazer coisa alguma. NAO VIRA MAQUINARIA AGORA — o denominador esta congelado em 30 ate o numerador sair de 3. Entra no ciclo em que o numerador mudar, com o dado ja levantado, e nao com o padrao redescoberto."}

