- {id: FIT-001, kind: fitness, statement: Nenhum dominio emite o evento autoritativo de outro., evaluated_by: genome, check: single_emitter}
- {id: FIT-002, kind: fitness, statement: Nenhuma publicacao e dada como feita sem transporte., evaluated_by: runtime, claim: CLM-0003}
- {id: FIT-003, kind: fitness, statement: Nenhuma execucao ocorre sem autoridade valida., evaluated_by: runtime, claim: CLM-0009}
- {id: FIT-004, kind: fitness, statement: Nenhum conhecimento em PROPOSTA e consumido como autoritativo., evaluated_by: genome, check: knowledge_validity}
- {id: FIT-005, kind: fitness, statement: Todo ato de autoridade tem lineage., evaluated_by: runtime, claim: CLM-0010}
- {id: FIT-006, kind: fitness, statement: O codigo so produz valores que existem na dimensao canonica., evaluated_by: genome, check: observed_values}
- {id: FIT-007, kind: fitness, statement: "Uma tela so exibe o que declara, e resultado de autoridade so a partir de contrato de quem pode autorizar.", evaluated_by: genome, check: screen_authority}
- {id: FIT-008, kind: fitness, statement: Todo contrato lido por tela existe e nao esta aposentado., evaluated_by: genome, check: screen_contracts}
- {id: FIT-009, kind: fitness, statement: Autoridade juridica nunca e derivada de comparacao de texto livre., evaluated_by: runtime, claim: CLM-0011}
- {id: FIT-010, kind: fitness, statement: "O genoma nao e a segunda fonte da verdade sobre contratos: produtor e lifecycle de todo contrato in_registry batem com o Contract Registry do kit instalado; contrato que o kit tem e o genoma nega tambem diverge.", evaluated_by: genome, check: registry_alignment}
- {id: FIT-011, kind: fitness, statement: "A contagem da cadeia e POR ESCALA: toda prova de elo declara a escala do fato observado (enum da Constituicao do kit) e um elo provado numa escala BLOQUEADA nao conta naquela escala.", evaluated_by: genome, check: chain_scale}
- {id: FIT-012, kind: fitness, statement: "Toda prova por teste declara a SUPERFICIE que cobre (mechanism: repo, paths, content_hash, commit), com precisao de arquivo — nunca repositorio inteiro, diretorio ou curinga. Mudou a superficie, a prova precisa ser feita de novo; a CI do proprio monolito acusa.", evaluated_by: genome, check: proof_surface}
- {id: FIT-013, kind: fitness, statement: "Todo campo RELATADO declara a origem: derived (extraido de fonte verificavel e conferido pelo juiz contra ela) ou asserted (escrito por humano ou IA). Campo asserted nao sustenta PROVEN nem entra na contagem da cadeia — sustenta divida e alerta.", evaluated_by: genome, check: field_provenance}
- {id: FIT-014, kind: fitness, statement: "Falsa afirmacao evitada (PFC) so conta com teste de regressao que EXISTE: o juiz confere arquivo e nome. Sem teste executavel, 'erro evitado' e asserted — o defeito que o genoma combate.", evaluated_by: genome, check: pfc_regression_test}
- {id: FIT-015, kind: fitness, statement: "O genoma e publico: nenhum dado pessoal entra (CPF, CNPJ, e-mail, telefone, matricula ou inscricao imobiliaria, CEP). Parametro do caso real — municipio, zona, areas, indices — pode; identificacao, nunca. A mesma varredura vale para o liceu-protocol.", evaluated_by: genome, check: privacy_scan}
- {id: FIT-016, kind: fitness, statement: "Previsao pre-registrada so se resolve pelo MUNDO REAL (observacao externa), so conta se a prova for POSTERIOR ao registro, e so vale se declarar o ato que a resolve. Previsao registrada depois do fato e explicacao do ocorrido, e explicacao do ocorrido nao mede base nenhuma.", evaluated_by: genome, check: prediction_pre_registration}
- {id: FIT-017, kind: fitness, statement: "Produtor sem `repository` declara `hosted_in` apontando outro produtor que TENHA repositorio, mais a razao. Nenhuma fitness confere o kit contra o mundo: `repository: null` pode ser a verdade e mesmo assim nao dizer onde o codigo esta. Prosa em campo de nome maiusculo explica para humano; o juiz nao le prosa.", evaluated_by: genome, check: producer_hosting}
- {id: FIT-018, kind: fitness, statement: "Invariante CONDICIONAL do contrato e executavel: o campo exigido 'quando' tal coisa esta no payload_schema (if/then, dependentRequired), e nao so na prosa de domain_invariants. Prosa explica para humano; gerador de vetores, boundary e produtor nao leem prosa — e quem le so o esquema acusa o produtor que obedeceu o contrato. A pergunta e por CAMPO: ter um `if` no esquema nao cobre outro campo. O vocabulario e estreito e declarado ('quando', 'somente se'); invariante escrito fora dele escapa, e isso e limite nomeado, nao cobertura. Versao RETIRED nao e cobrada (decisao do titular, 2026-09-23): ninguem pode publicar nela, e reescrever o esquema de uma versao aposentada seria mudar o que ja foi publicado — divida sem conserto ensina a ignorar o livro. DEPRECATED continua sendo cobrada, porque contrato depreciado ainda pode ser usado. O que se deixa de cobrar vira AVISO com a linha inteira: parar de contar nao e parar de olhar.", evaluated_by: genome, check: conditional_invariants}
