# CLM-0006: esta afirma que a sonda EXISTE e que o plano so aceita o que ela
# mede; a CLM-0006 afirma que a Testemunha observa de forma INDEPENDENTE, e
# isso exige separacao fisica, que nao existe.
- id: CLM-0059
  kind: claim
  statement: "Existe uma sonda que mede a Ativa pela rede, e o que o plano de controle grava como observacao e o que ela mediu — nao o que a Testemunha declara."
  asserted_by: "regime declarado no F3, 2026-09-30 — antes disto o ADR-003 §1.4 media que nao havia sonda em repositorio algum, e a Testemunha existia como segredo, nao como processo"

# Z1.1 (ciclo 16) — o levantamento que parou o Z1. A pergunta nao era se a
# Testemunha observa de forma independente; era se ela existe.
- id: CLM-0060
  kind: claim
  statement: "O modelo das tres Maes esta em operacao: ha tres instancias de liceu.authority, em dominios de falha distintos."
  asserted_by: "Constituicao 1.11.0, que acrescenta a Mae TESTEMUNHA e exige no posicionamento 'dominio de falha distinto das duas Maes de autoridade'; e a leitura de que a sonda construida no ciclo 15 passaria a observar algo"

# Z3 (ciclo 16) — o ato de autoridade nao passa pelo kit.
- id: CLM-0061
  kind: claim
  statement: "Todo ato de autoridade do ecossistema passa pelo kit e e verificavel pelo boundary."
  asserted_by: "premissa do desenho do protocolo — o kit e a lei (ADR-001) e o boundary e quem a aplica; a atestacao da Testemunha e ato de autoridade pela Constituicao, que a poe no caminho da promocao"

# A3 (ciclo 17) — a ausencia explicada vale mais que a ausencia estranha.
# "Zero provas em ambiente duravel" parecia lacuna do genoma; e consequencia.
- id: CLM-0062
  kind: claim
  statement: "O ecossistema tem ambiente implantado e duravel — producao — alem de CI, efemero e local."
  asserted_by: "leitura do docker-compose.vps.yml (overlay de TLS com Let's Encrypt, 2026-09-21) e da propria existencia de 19 repositorios com CI verde, que sugerem algo no ar"

# B3 (ciclo 18) — o limite do inventario, descoberto pela TERCEIRA vez na
# mesma semana. "Nomeado" e "consumido" sao coisas diferentes.
- id: CLM-0063
  kind: claim
  statement: "O inventario de segredos distingue nome CONSUMIDO de nome MENCIONADO: suas ocorrencias indicam uso."
  asserted_by: "premissa do uso do inventario como mapa de raio de dano — contar ocorrencias e trata-las como consumidores, que e como ele foi lido para escolher o alvo da primeira rotacao"

# B3 (ciclo 18) — rotacionar nao revoga quando o antigo tem valor no codigo.
- id: CLM-0064
  kind: claim
  statement: "Os segredos do ecossistema sao rotacionaveis: trocar o valor da variavel revoga o valor anterior."
  asserted_by: "premissa da F0-C — a rotacao pressupoe que o valor antigo deixa de ser aceito quando o novo entra"

# B3 (ciclo 18) — achado independente da rotacao, e o caso mais comum no mundo
# real: credencial que morre FORA do servico.
- id: CLM-0065
  kind: claim
  statement: "Um servico que depende de credencial externa degrada com graca quando a credencial deixa de valer."
  asserted_by: "premissa do modo simulado do JURIDICO-TECH — a existencia de um caminho de degradacao foi lida como cobertura da falha de credencial"

# Ciclo 19 — o juiz julgava datas e nao conferia nenhuma. Achado ao MEDIR o
# grafo para o relatorio, e nao ao procurar defeito.
- id: CLM-0066
  kind: claim
  statement: "Toda data que o juiz compara e conferida: data mal formada, inexistente no calendario ou posterior a hoje nao entra no grafo, e o veredito nao depende do fuso de quem roda."
  asserted_by: "premissa de TODA comparacao de data dentro do juiz — _expired faz str(expires_at) < today, a FIT-016 faz p[date] < pred[registered_at] e a historia ordena por str(date); as tres pressupoem uma data que ninguem conferia"

# Ciclo 19 — vazio significando "tudo bem". Achado por um erro cometido no
# proprio relatorio do ecossistema, e nao por auditoria.
- id: CLM-0067
  kind: claim
  statement: "As ferramentas de medicao do ecossistema distinguem 'nada encontrado' de 'nao consegui conferir': varredura que itera sobre N itens exige N respostas."
  asserted_by: "premissa de TODA leitura de varredura — relatorio de borda, inventario de segredos, varredura de privacidade e varredura de CI foram lidos como se saida vazia significasse ausencia de achado"

# Ciclo 19 — e o que este repositorio passou a garantir sobre as suas.
- id: CLM-0068
  kind: claim
  statement: "As varreduras do liceu-genome exigem resposta por item: arquivo que nao se deixa ler vira NAO_MENSURAVEL com nome e motivo, e a frase de aprovacao traz o denominador."
  asserted_by: "a regra em tools/varredura.py e os chamadores dela — genome_privacy_check, varredura_publica e a FIT-015 do juiz"

# Ciclo 20 (D3) — o inventario passa a ter veredito por ocorrencia.
- id: CLM-0069
  kind: claim
  statement: "O inventario distingue USO de MENCAO por ocorrencia, e deriva o nome da variavel que chega por env_prefix sob outro identificador."
  asserted_by: "a regra em infra/security/uso_de_segredo.py e o inventario que a consome, construidos no ciclo 20 porque a proxima rotacao escolhe o alvo com este mapa"

# Ciclo 20 (D1) — o que a prova de revogacao passou a exigir.
- id: CLM-0070
  kind: claim
  statement: "A prova de revogacao exige que a credencial antiga tenha sido MEDIDA como aceita antes da revogacao: recusa sem linha de base nao conta como revogacao."
  asserted_by: "a regra em infra/security/prova_de_revogacao.py depois do quase-acidente de 2026-10-01 (FC-007), construida porque a proxima rotacao escolhe o alvo e conclui o veredito com este instrumento"

# Ciclo 21 (E1) — o indice que a ferramenta nao avaliava, e que agora acusa.
- id: CLM-0071
  kind: claim
  statement: "Indice cujo valor a norma traz mas cuja DIRECAO de limite ela nao declara entra na conferencia como INDETERMINADO nomeado, e nao fica fora da lista."
  asserted_by: "o tipo direcao_desconhecida em juridicotech/modules/conformidade_urbanistica.py, construido no ciclo 21 porque o I.E ficava invisivel no relatorio e a lacuna do perfil continuava dizendo que o significado era desconhecido"

# Ciclo 22 (G1) — o fato que o ecossistema esperava, e que nao e ato do LICEU.
- id: CLM-0072
  kind: claim
  statement: "O processo de aprovacao de projeto e execucao da Casa P-001 foi protocolado na Prefeitura de Vargem Grande Paulista."
  asserted_by: "o titular, em 2026-10-02, e conferido contra os documentos que subiram ao acervo no mesmo dia"

# Ciclo 22 (G1) — a pergunta que a procuracao respondeu.
- id: CLM-0073
  kind: claim
  statement: "O requerimento do protocolo so pode ser assinado pelo titular do imovel, e o RT precisaria dele presente."
  asserted_by: "premissa da UNK-0016, aberta em 2026-09-28: 'quem assina o requerimento do item 1 — o titular ou o RT? Se for o RT, o item exige procuracao'"
