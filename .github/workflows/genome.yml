name: Genome
on: [push, pull_request]

jobs:
  genome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # o freio da H6 deriva a serie do git: precisa de historia
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Inclui o kit liceu-protocol na tag vigente: a FIT-010 julga o genoma
      # contra o Contract Registry INSTALADO. Sem o kit, o juiz nao julga.
      - run: pip install -r requirements.txt

      - name: Kit instalado (tag vigente)
        run: python -c "from liceu_protocol import KIT_DIR; print((KIT_DIR/'VERSION').read_text())"

      # Primeiro o juiz é julgado: se ele não pega as mutações, o veredito dele não vale.
      - name: Testes de mutação (juiz)
        run: python tools/test_genome_check.py

      # A data que o juiz COMPARA passou a ser conferida: forma na lei, calendário
      # e futuro no módulo. Mesma razão da FIT-017 para viver separado — a
      # superfície da prova é o módulo, não o juiz de 1700 linhas.
      - name: Testes de mutação (a data que o juiz compara)
        run: python tools/test_genome_date_check.py

      # A FIT-017 vive em módulo próprio para que a superfície da PRF-0031 não
      # seja o juiz inteiro. Módulo que a CI não roda é módulo que ninguém
      # confere, então o passo entra junto com a separação, e não depois.
      - name: Testes de mutação (FIT-017 — onde mora o código de cada produtor)
        run: python tools/test_genome_producer_hosting.py

      # Mesmo motivo da FIT-017: a FIT-019 vive em módulo próprio para que a
      # superfície da prova não seja o juiz inteiro. Módulo que a CI não roda é
      # módulo que ninguém confere, então o passo entra junto com a separação.
      - name: Testes de mutação (FIT-019 — a cobertura declarada de busca)
        run: python tools/test_genome_scope_check.py

      # C25-06: o enumerador das declarações de estado da lei. Ele existe porque
      # o enumerador de 2026-10-09 NÃO FOI GUARDADO — o 48 da PRF-0127 virou
      # número escrito num documento, que é exatamente a classe que ele denuncia.
      #
      # Os dois casos que justificam o passo: a derivação tem de ACUSAR quem mexe
      # na lista e não reconta (mutação em `pendencias`, em `monolitos` e na
      # contagem escrita dentro de prosa), e o mapa de origem tem de falhar
      # FECHADO nas DUAS direções — ESTADO sem origem e origem cujo campo sumiu.
      - name: Testes de mutação (C25-06 — as declarações de estado da lei)
        run: python tools/test_declaracoes_de_estado.py

      # E o portão propriamente: campo novo na lei sem origem declarada para a
      # CI, e derivável DECLARADO sem derivação DE VERDADE também. A segunda
      # metade é o buraco que o mapa sozinho deixava — declarar um campo como
      # derivável e seguir escrevendo o valor à mão é a mesma afirmação que a
      # regra proíbe. Custa ZERO no denominador do grafo: é guarda de
      # instrumento, não fitness nova.
      - name: "C25-06: todo ESTADO tem origem, e todo derivável deriva"
        run: python tools/declaracoes_de_estado.py --exigir-mapa --conferir-derivaveis

      # O detector de superfície roda na CI dos monólitos; aqui prova-se que ELE
      # pega a mudança — é onde vive o teste "content_hash diferente do arquivo".
      - name: Testes de mutação (detector de superfície)
        run: python tools/test_genome_surface_check.py

      # O PFC nascido de um processo real tem o teste no monólito, não aqui. O
      # detector que confere isso roda na CI de lá; é aqui que se prova que ELE
      # pega o teste que sumiu ou mudou de nome.
      - name: Testes de mutação (detector de PFC sem prova executável)
        run: python tools/test_genome_pfc_check.py

      # N itens, N respostas. A varredura que itera e nao exige resposta de cada
      # item reporta tranquilidade sobre o que nao leu — foi assim que uma
      # varredura de CI mediu zero repositorios e disse "nenhum vermelho".
      - name: Testes de mutação (N itens, N respostas)
        run: python tools/test_varredura.py

      # O genoma e o kit sao PUBLICOS: dado pessoal que entrar fica na internet.
      - name: Privacidade — nenhum dado pessoal no repositório público
        run: python tools/genome_privacy_check.py --root .

      # O genoma exigia de todo monólito uma conferência que não fazia em si
      # mesmo. Prova sobre o próprio juiz também tem superfície, e também
      # envelhece quando o arquivo muda.
      - name: A superfície provada DO PRÓPRIO GENOMA mudou?
        run: python tools/genome_surface_check.py --repo liceu-genome --root . --proofs genome/07-proofs.yaml

      - name: Genoma — schema, arestas, derivação, fitness (inclui FIT-010 contra o kit), catraca
        run: python tools/genome_check.py --history --json self-model.json --html self-model.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-model
          path: self-model.*
